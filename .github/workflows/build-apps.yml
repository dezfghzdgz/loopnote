# Sestaví appky Loopnote: Android (APK), Windows (instalačka), Mac (DMG), Linux (AppImage).
# Spuštění: GitHub → Actions → "Build apps" → Run workflow.
# Hotové instalačky se samy vydají do veřejného repozitáře loopnote-download (potřebuje secret RELEASES_TOKEN)
# a tlačítka Download na webu je rovnou stahují.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy web app
        run: node scripts/prepare-www.mjs mobile/www
      - name: Install Capacitor
        working-directory: mobile
        run: npm install
      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          # mikrofon + bublina přes ostatní aplikace (nativní plugin)
          python3 ../scripts/android-native.py
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # vždy stejný podpisový klíč – jinak by nová verze nešla nainstalovat přes starou
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          # kdyby se bublina nepovedla přeložit, appka se sestaví bez ní (ať je vždy co stáhnout); napřed jeden pokus navíc kvůli výpadku sítě
          if ! ./gradlew assembleDebug --no-daemon && ! ./gradlew assembleDebug --no-daemon; then
            echo "::warning::Android bubble failed to compile – building without it"
            python3 ../../scripts/android-native.py --remove
            ./gradlew assembleDebug --no-daemon
          fi
      - name: Rename
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Loopnote-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Loopnote-android
          path: Loopnote-android.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy web app
        run: node scripts/prepare-www.mjs desktop/www
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Loopnote-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    # po každém sestavení vydá novou verzi do veřejného repozitáře loopnote-download
    # (zdrojový kód může zůstat soukromý) – web pak stahuje přímo odtud
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/loopnote-download
          token: ${{ secrets.RELEASES_TOKEN }}
          target_commitish: main
          tag_name: v0.1.${{ github.run_number }}
          name: Loopnote 0.1.${{ github.run_number }}
          make_latest: true
          files: out/*

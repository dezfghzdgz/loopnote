<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7c6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loopnote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="alternate icon" href="../favicon.ico">
<script src="../config.js"></script>
<title>Loopnote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: knihovna sešitů (mřížka obálek) -> editor na celou obrazovku (horní lišta, nástroje, stránky na "stole") + plovoucí panel pomocníka */
:root{
  --bg:#eceeed; --surface:#f8f9f8; --raised:#ffffff; --line:#d6dbd9; --desk:#e2e6e4;
  --fg:#18201e; --muted:#5e6a67; --accent:#0f7c6b; --accent-fg:#ffffff; --accent-soft:#dbefea;
  --danger:#c4372b; --shadow:rgba(16,32,28,.22);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-hand:"Kalam","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#171c1b; --raised:#1e2524; --line:#2c3533; --desk:#0b0e0d;
  --fg:#e4ebe9; --muted:#95a3a0; --accent:#4fd1b6; --accent-fg:#06221c; --accent-soft:#163a33;
  --danger:#ff8a7a; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#171c1b; --raised:#1e2524; --line:#2c3533; --desk:#0b0e0d;
  --fg:#e4ebe9; --muted:#95a3a0; --accent:#4fd1b6; --accent-fg:#06221c; --accent-soft:#163a33;
  --danger:#ff8a7a; --shadow:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:11px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px}
.iconbtn:hover{background:var(--bg)}
.iconbtn:disabled{opacity:.35}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}

/* ---------- onboarding ---------- */
#onb{min-height:100vh;display:grid;place-items:center;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px}
.onb-card{width:100%;max-width:560px;background:var(--raised);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 60px -30px var(--shadow);display:flex;flex-direction:column;gap:20px}
.onb-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.logo svg{width:26px;height:26px;display:block}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent);width:22px;border-radius:4px}
.onb-body h1{font-size:30px;line-height:1.15;margin-bottom:6px}
.onb-body .lead{color:var(--muted);margin:0 0 18px;max-width:46ch}
.stack{display:flex;flex-direction:column;gap:10px}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.sso.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:400;color:var(--fg)}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}
.opts{display:grid;gap:10px}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:13px;line-height:1.35}
.opt .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.meter{display:flex;gap:3px;margin-bottom:4px}
.meter i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}
.onb-foot{display:flex;justify-content:space-between;gap:10px}
.papers{display:flex;flex-wrap:wrap;gap:10px}
.paperchip{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.paperchip span{width:58px;height:74px;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 4px 10px -6px var(--shadow)}
.paperchip[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--accent),0 4px 10px -6px var(--shadow)}
.paperchip[aria-pressed="true"]{color:var(--fg)}
.onb-preview{height:150px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:flex-start;padding:22px 26px;font-family:var(--f-hand);font-size:24px;line-height:1.2}

/* ---------- knihovna ---------- */
#lib{max-width:1180px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 60px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.lib-head h1{font-size:40px;line-height:1}
.hello{color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--surface)}
.lib-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:34px 26px}
.nb{display:flex;flex-direction:column;gap:12px;min-width:0}
.nb-open{display:block;width:100%;border-radius:6px 12px 12px 6px}
.nb-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.nb-meta div{min-width:0}
.nb-meta b{display:block;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-meta small{color:var(--muted);font-size:12.5px}
.nb-meta .iconbtn{width:32px;height:32px;margin-top:-4px}
.book{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border-radius:4px 11px 11px 4px;
  background:var(--pat),linear-gradient(100deg,rgba(255,255,255,.16),rgba(255,255,255,0) 32%,rgba(0,0,0,.16)),var(--c);
  box-shadow:0 1px 0 rgba(0,0,0,.25),3px 3px 0 -1px #f5f3ee,3px 3px 0 0 rgba(0,0,0,.14),6px 6px 0 -2px #efece6,6px 6px 0 -1px rgba(0,0,0,.12),0 16px 26px -14px var(--shadow);
  transition:transform .18s ease}
.nb-open:hover .book,.nb-open:hover .sheetprev{transform:translateY(-4px) rotate(-.4deg)}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:15px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.1) 60%,rgba(255,255,255,.14))}
.book .band{position:absolute;top:0;bottom:0;right:17px;width:7px;background:linear-gradient(90deg,#111,#3a3a3a 45%,#0c0c0c);opacity:.85;box-shadow:1px 0 2px rgba(0,0,0,.35)}
.book .label{position:absolute;left:25px;right:36px;top:20%;background:#fbfaf6;color:#1d2321;border-radius:4px;padding:10px 10px 9px;
  background-image:repeating-linear-gradient(180deg,transparent 0 17px,rgba(40,70,110,.14) 17px 18px);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.book .label b{display:block;font-family:var(--f-hand);font-weight:700;font-size:17px;line-height:1.1;overflow-wrap:break-word;hyphens:auto}
.book .label small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b7370;margin-top:4px}
.sheetprev{position:relative;width:100%;aspect-ratio:800/1130;border-radius:3px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),3px 3px 0 -1px #f5f3ee,3px 3px 0 0 rgba(0,0,0,.12),0 16px 26px -14px var(--shadow);transition:transform .18s ease}
.sheetprev img{width:100%;height:100%;object-fit:cover;display:block}
.sheetprev .tab{position:absolute;right:10px;top:0;width:18px;height:26px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.newcard{aspect-ratio:3/4;width:100%;border:2px dashed var(--line);border-radius:6px 12px 12px 6px;display:grid;place-items:center;color:var(--muted);font-weight:700;align-content:center;gap:8px}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.newcard svg{width:30px;height:30px}

/* ---------- editor ---------- */
#ed{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk);z-index:5}
.ed-top{display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.ed-top .back{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--accent);padding:8px 8px 8px 2px;border-radius:9px}
.ed-title{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;font-family:var(--f-display);font-weight:700;font-size:17px;text-align:center}
.ed-title:hover,.ed-title:focus{border-color:var(--line);background:var(--raised)}
.ed-tools{display:flex;align-items:center;gap:4px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.tool{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 1px 3px var(--shadow)}
.tool .lbl{display:inline}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px;flex:none}
.sw{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);margin:0 3px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw.auto{background:linear-gradient(135deg,#1b1f24 50%,#f1f3f5 50%)}
.sw.add{display:grid;place-items:center;background:var(--bg);color:var(--muted);position:relative;overflow:hidden}
.sw.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.wbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;flex:none}
.wbtn i{display:block;border-radius:50%;background:currentColor}
.wbtn[aria-pressed="true"]{background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.tool.ask{margin-left:auto;background:var(--accent);color:var(--accent-fg);padding:0 14px}
.tool.ask[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);background:var(--accent);color:var(--accent-fg)}
.scroller{flex:1;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:flex-start;gap:34px;
  padding:26px max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pagewrap{position:relative;flex:none;margin:0 auto;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 14px 34px -16px var(--shadow)}
.pagewrap canvas{position:absolute;left:0;top:0;display:block}
.pagewrap canvas.live{touch-action:none;cursor:crosshair}
.pageno{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.addpage{border:2px dashed var(--line);border-radius:12px;padding:14px 22px;color:var(--muted);font-weight:700;flex:none;margin:0 auto}
.addpage:hover{border-color:var(--accent);color:var(--accent)}
.selmenu{position:absolute;z-index:3;display:flex;gap:2px;background:var(--fg);color:var(--bg);border-radius:12px;padding:4px;box-shadow:0 10px 24px -10px var(--shadow);white-space:nowrap}
.selmenu button{padding:8px 10px;border-radius:9px;font-size:13px;font-weight:700}
.selmenu button:hover{background:rgba(127,127,127,.25)}
.selmenu .hot{color:var(--accent)}
.textedit{position:absolute;z-index:4;border:1.5px dashed var(--accent);background:transparent;resize:none;outline:none;overflow:hidden;padding:0;margin:0;white-space:pre;line-height:1.25}

/* ---------- panel pomocníka ---------- */
#aiPanel,#notesPanel,#awSheet{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(400px,calc(100vw - 24px));background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 60px -24px var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.ai-head .spark{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ai-head div{flex:1;min-width:0}
.ai-head b{display:block;font-family:var(--f-display);font-size:17px}
.ai-head small{color:var(--muted);font-size:12px}
.ai-snip{margin:12px 14px 0;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:#fff;max-height:110px;display:flex;justify-content:center}
.ai-snip img{max-height:110px;max-width:100%;object-fit:contain;display:block}
.ai-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 14px 0}
.ai-levels button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px 6px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.ai-levels .meter i{width:6px;height:9px}
.ai-levels button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.ai-body{flex:1;overflow:auto;padding:12px 16px;font-size:15px;line-height:1.55}
.ai-body h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:14px 0 4px}
.ai-body h4:first-child{margin-top:0}
.ai-body p{margin:0 0 8px}
.ai-body ul,.ai-body ol{margin:0 0 8px;padding-left:20px}
.ai-body li{margin-bottom:3px}
.ai-body .q{margin:14px 0 10px auto;max-width:85%;width:fit-content;background:var(--accent-soft);border-radius:12px 12px 4px 12px;padding:7px 11px;font-size:14px}
.ai-body .demo{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-bottom:8px}
.ai-body .err{color:var(--danger);font-weight:700;font-size:14px}
.ai-body .note{color:var(--muted);font-size:13px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ai-act{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.ai-act .btn{padding:8px 11px;font-size:13px}
.ai-ask{display:flex;gap:6px;border-top:1px solid var(--line);padding:10px 12px}
.ai-ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}

/* ---------- modaly, toast ---------- */
.modal-back{position:fixed;inset:0;z-index:20;background:rgba(8,18,16,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:720px;max-height:100%;overflow:auto;background:var(--raised);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0}
.modal-h h2{font-size:22px}
.modal-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:18px}
.modal-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 20px 20px}
.nbform{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:start}
.nbform .pv{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.group{display:flex;flex-direction:column;gap:8px}
.group>.eyebrow{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cover-sw{width:32px;height:32px;border-radius:8px;box-shadow:0 0 0 2px var(--raised),0 0 0 3px var(--line)}
.cover-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;text-align:left}
.toggle small{display:block;color:var(--muted);font-size:13px}
.toggle .knob{width:42px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}

.lyrow{display:flex;align-items:center;gap:2px;border-radius:8px;padding:2px}.lyrow.on{background:var(--accent-soft)}.lyrow button{border:0;background:none;padding:4px 6px;border-radius:6px;font-size:13px}.lyrow .lyname{flex:1;text-align:left;font-weight:700}.lyrow button:disabled{opacity:.3}
.brushes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.brushbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);border-radius:10px;padding:4px 8px 6px;background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}.brushbtn canvas{width:120px;height:36px}.brushbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.pop-sec{display:flex;flex-direction:column;gap:8px}

.sw.mini{width:18px;height:18px;margin:0;box-shadow:0 0 0 1px var(--line)}

.stylebtn{gap:8px;padding:0 8px 0 10px;border:1px solid var(--line);background:var(--raised)}

div.qopt{cursor:default}.recall-tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- v3 ---------- */

.graphform{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}

</style>
<style>.recbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-weight:700;font-size:13px;color:var(--fg);margin-right:6px}.recbtn[hidden]{display:none}.recbtn .rdot{width:10px;height:10px;border-radius:50%;background:#e03131}.recbtn.on{background:#e03131;border-color:#e03131;color:#fff}.recbtn.on .rdot{background:#fff;border-radius:2px;animation:tkp 1s infinite alternate}@media (max-width:640px){#recBtnT{display:none}.recbtn{padding:0 10px}}.is-desktop #fab{display:none!important}.talkbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}.talkbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2,inherit)}.talkbar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(calc(1 + var(--lv,0)*.8));transition:transform .08s}.talkbar .dot.thinking,.talkbar .dot.heard{animation:tkp 1s infinite alternate}.talkbar .dot.error{background:#c0392b}.talkbar .linkbtn{margin-left:auto}@keyframes tkp{from{opacity:.3}to{opacity:1}}#onb .sso,#onb .or{display:none!important}.linkbtn{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}html,body{overscroll-behavior:none}</style>

function compileExpr(src){let s=String(src||'').trim().replace(/^[a-z]?\s*\(\s*x\s*\)\s*=|^y\s*=/i,'')

  const toks=[];let i=0;

    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=parseFloat(s.slice(i,j));if(isNaN(n))throw new Error('Divné číslo: '+s.slice(i,j));toks.push({t:'n',v:n});i=j;continue}
    if(/[a-z]/.test(c)){let j=i;while(j<s.length&&/[a-z]/.test(s[j]))j++;let w=s.slice(i,j);
      while(w){let hitW=null;for(const k of [...Object.keys(FN),'pi','e','x'].sort((a,b)=>b.length-a.length))if(w.startsWith(k)){hitW=k;break}
        if(!hitW)throw new Error('Neznám „'+w+'“. Použij x, sin, cos, sqrt, ln…');toks.push(FN[hitW]?{t:'f',v:hitW}:{t:'id',v:hitW});w=w.slice(hitW.length)}
      i=j;continue}
    if('+-*/^()|'.includes(c)){toks.push({t:c});i++;continue}
    throw new Error('Znak „'+c+'“ tu nejde použít')}
  let p=0;const peek=()=>toks[p],eat=t=>{if(!toks[p]||toks[p].t!==t)throw new Error('Chybí „'+t+'“');p++};
  const startsPrimary=k=>k&&(k.t==='n'||k.t==='id'||k.t==='f'||k.t==='(');
  function expr(){let a=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=toks[p++].t,b=term(),l=a;a=op==='+'?x=>l(x)+b(x):x=>l(x)-b(x)}return a}
  function term(){let a=unary();for(;;){const k=peek();if(k&&(k.t==='*'||k.t==='/')){p++;const b=unary(),l=a;a=k.t==='*'?x=>l(x)*b(x):x=>l(x)/b(x)}else if(startsPrimary(k)){const b=power(),l=a;a=x=>l(x)*b(x)}else return a}}

  function primary(){const k=toks[p++];if(!k)throw new Error('Výraz je neúplný');
    if(k.t==='n'){const v=k.v;return ()=>v}
    if(k.t==='id'){if(k.v==='x')return x=>x;if(k.v==='pi')return ()=>Math.PI;return ()=>Math.E}
    if(k.t==='('){const a=expr();eat(')');return a}
    if(k.t==='|'){const a=expr();eat('|');return x=>Math.abs(a(x))}
    if(k.t==='f'){const f=FN[k.v];let a;if(peek()&&peek().t==='^'){p++;const ex=unary();const arg=power();return x=>Math.pow(f(arg(x)),ex(x))}a=power();return x=>f(a(x))}
    throw new Error('Nečekaný znak „'+k.t+'“')}
  const fn=expr();if(p<toks.length)throw new Error('Nečekaný znak „'+(toks[p].t==='n'?toks[p].v:toks[p].t)+'“');return fn}

function bboxPts(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){if(q[0]<a)a=q[0];if(q[1]<b)b=q[1];if(q[0]>c)c=q[0];if(q[1]>d)d=q[1]}return {x:a,y:b,w:c-a,h:d-b}}

  if(o.type==='card'){layoutCard(o);return {x:o.x,y:o.y,w:o.w,h:o._h}}
  if(o.type==='image'||o.type==='graph')return {x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.type==='math'){const b=mathBox(o);return {x:o.x,y:o.y,w:b.w,h:b.h}}
  if(o.kind==='line'){const r=o.w/2+1;return {x:Math.min(o.x1,o.x2)-r,y:Math.min(o.y1,o.y2)-r,w:Math.abs(o.x2-o.x1)+2*r,h:Math.abs(o.y2-o.y1)+2*r}}
  if(o.kind==='rect')return {x:Math.min(o.x,o.x+o.rw),y:Math.min(o.y,o.y+o.rh),w:Math.abs(o.rw),h:Math.abs(o.rh)};
  return {x:o.cx-o.rx,y:o.cy-o.ry,w:o.rx*2,h:o.ry*2}}

function openPop(anchor,items,onPick,extraHTML){closePop();const p=document.createElement('div');p.className='pop';p.setAttribute('role','menu');

  document.body.appendChild(p);popEl=p;const r=anchor.getBoundingClientRect();const pw=p.offsetWidth,ph=p.offsetHeight;
  let left=Math.min(window.innerWidth-pw-12,Math.max(12,r.right-pw));if(r.left+pw<window.innerWidth-12&&r.left>window.innerWidth/2-pw/2&&false)left=r.left;
  let top=r.bottom+6;if(top+ph>window.innerHeight-12)top=Math.max(12,r.top-ph-6);p.style.left=left+'px';p.style.top=top+'px';
  p.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const keep=b.dataset.keep;if(!keep)closePop();onPick(b.dataset.k,b)});return p}

/* ---------- texty stránek, hledání ---------- */
const norm=s=>String(s).split('').map(c=>(c.normalize('NFD')[0]||c).toLowerCase()[0]||c).join('');
function pageTyped(pg){const out=[];for(const o of pg.objs){if(o.type==='image'&&o.pdfText)out.push('[PDF] '+o.pdfText);else if(o.type==='text'||o.type==='card')out.push(o.text);else if(o.type==='math')out.push(texToUni(o.tex));else if(o.type==='graph')out.push('Graf: '+o.fns.map(f=>'y = '+f.e).join(', ')+(o.title?' ('+o.title+')':''))}return out.join('\n')}
function hasInk(pg){return pg.objs.some(o=>(o.type==='stroke'&&o.tool!=='hl')||o.type==='image')}
function needsOcr(pg){return hasInk(pg)&&pg.ocrRev!==(pg.rev||0)}
function unreadPages(){const out=[];S.notebooks.forEach(nb=>nb.pages.forEach((pg,i)=>{if(needsOcr(pg))out.push({nb,pg,i})}));return out}
function runSearch(q){const box=$('#results');q=q.trim();if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const nq=norm(q),res=[];
  S.notebooks.forEach(nb=>{nb.pages.forEach((pg,i)=>{const parts=[['',pageTyped(pg)],['rukopis',pg.ocr||'']];
    for(const [src,txt] of parts){const n=norm(txt);const at=n.indexOf(nq);if(at<0)continue;
      const a=Math.max(0,at-40),b=Math.min(txt.length,at+nq.length+60);const snip=(a?'…':'')+esc(txt.slice(a,at))+'<mark>'+esc(txt.slice(at,at+q.length))+'</mark>'+esc(txt.slice(at+q.length,b))+(b<txt.length?'…':'');
      res.push({nb,i,snip:snip.replace(/\n/g,' · '),src});break}});
    if(norm(nb.title+' '+(nb.subject||'')).includes(nq)&&!res.some(r=>r.nb===nb))res.push({nb,i:0,snip:'Název sešitu',src:''})});
  const unread=unreadPages().length;
  box.innerHTML=(res.length?res.slice(0,12).map(r=>`<button type="button" class="res" data-nb="${r.nb.id}" data-pg="${r.i}"><span class="dot" style="background:${r.nb.cover.color}"></span><span><b>${esc(r.nb.title)}</b><small>str. ${r.i+1}</small>${r.src?`<span class="src">${r.src}</span>`:''}<p>${r.snip}</p></span></button>`).join('')
    :`<p class="hello">Nic jsem nenašel pro „${esc(q)}“.</p>`)+(unread?`<p class="fine">${unread} ${unread===1?'stránka má':'stránek má'} nepřečtený rukopis, takže v něm zatím nehledám. Přečíst ho můžeš v okně „Zeptej se svých zápisků“.</p>`:'');
  box.hidden=false}
$('#search').addEventListener('input',e=>runSearch(e.target.value));
$('#results').addEventListener('click',e=>{const b=e.target.closest('[data-nb]');if(b)openNotebook(b.dataset.nb,+b.dataset.pg)});

const CHAT_RE=/^(jasně|jasne|dobře|super|skvěle|výborně|paráda|ok|okej|tak(že)? (tady|zde)|tady je|zde je|zkontroloval|prošel jsem|podíval jsem|rád ti|určitě|doufám|nic (podstatného |důležitého )?(v (nich|tom|poznámkách) )?nechybí|ahoj|díky)/i;
const COACH_H=/^(zkus (si )?(to )?sám|zkus si|zkus to|co dál|tvoje úloha|otázka pro tebe|úkol pro tebe|kontroluji|zkontroloval)/i;
function noteClean(text){const out=[];let skip=false;for(const raw of cleanAns(String(text),false).split('\n')){const l=raw.trim();const h=l.match(/^#{1,4}\s+(.*)/);
    if(h){skip=COACH_H.test(h[1].trim());if(!skip)out.push(raw);continue}if(skip)continue;
    const plain=l.replace(/^[-•*]\s+/,'').replace(/\*\*/g,'');if(CHAT_RE.test(plain)&&!/[=$]/.test(plain))continue;if(/^(chceš|mám ti|zkusíš|víš|pomohlo)/i.test(plain)&&/\?\s*$/.test(plain))continue;out.push(raw)}
  const t=out.join('\n').replace(/(^|\n)#{1,4}[^\n]*\n(?=\s*(#{1,4}\s|$))/g,'$1').trim();return /^#{1,4}[^\n]*$/.test(t)?'':t}
function mdToNote(text,title){const blocks=[];let lastH='';for(const raw of cleanAns(String(text),false).split('\n')){const l=raw.trim();if(!l)continue;let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){lastH=m[1];blocks.push({t:'h',text:m[1]})}
    else if((m=l.match(/^\$\$([\s\S]+)\$\$$/))){blocks.push({t:/výsledek|vzorec/i.test(lastH)?'key':'f',tex:m[1]})}
    else if((m=l.match(/^[-•*]\s+(.*)/)))blocks.push({t:'li',text:m[1]});
    else if((m=l.match(/^(\d+[.)])\s+(.*)/)))blocks.push({t:'li',text:m[1]+' '+m[2]});
    else blocks.push({t:'p',text:l})}
  return {title,blocks}}
function noteHeight(objs){let a=1e9,b=-1e9;for(const o of objs){const q=bboxOf(o);a=Math.min(a,q.y);b=Math.max(b,q.y+q.h)}return objs.length?{top:a,bottom:b}:{top:0,bottom:0}}
function appendNote(nb,data,snip){let pg=nb.pages[nb.pages.length-1];let maxY=0;for(const q of pg.objs){const b=bboxOf(q);maxY=Math.max(maxY,b.y+b.h)}
  let start=pg.objs.length?maxY+60:noteMetrics(nb).top;
  if(nb.layout==='pages'&&pg.objs.length&&start>pg.h-260){pg={id:uid(),h:H,objs:[],rev:0,ocr:'',ocrRev:0};nb.pages.push(pg);start=noteMetrics(nb).top}
  const n=buildNote(nb,data,60,start,W-120,snip);pg.objs.push(...n.objs);pg.mod=Date.now();const hb=noteHeight(pg.objs).bottom;if(hb>pg.h-40)pg.h=Math.ceil(hb+120);pg.rev=(pg.rev||0)+1;touch(nb);return nb.pages.indexOf(pg)}
function notePreview(nb,data,snip){const n=buildNote(nb,data,40,noteMetrics(nb).top,W-80,snip);const hb=Math.max(300,noteHeight(n.objs).bottom+50);const k=.6,cv=document.createElement('canvas');cv.width=Math.round(W*k);cv.height=Math.round(hb*k);

function stripAg(t){return String(t).replace(/\[\[ZAPIS[\s\S]*?(\[\[\/ZAPIS\]\]|$)/g,'').replace(/\[\[\/ZAPIS\]\]/g,'').replace(/\[\[(KALENDAR|TIMER|KRESLI)[\s\S]*?(\]\]|$)/g,'').replace(/\[\[?[KT]?[A-Z]*\s*$/,'')}

function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function md(t){const maths=[];t=stripAg(t).replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g,(m,a,b)=>{maths.push([a||b,true]);return `\u0001${maths.length-1}\u0001`})
    .replace(/\$([^$\n]+?)\$|\\\(([^\n]+?)\\\)/g,(m,a,b)=>{maths.push([a||b,false]);return `\u0001${maths.length-1}\u0001`});
  return mdCore(t).replace(/\u0001(\d+)\u0001/g,(m,i)=>{const [tex,d]=maths[+i];return texHTML(tex,d)||`<code>${esc(tex)}</code>`})}
function mdCore(t){let html='',list=null;const close=()=>{if(list){html+=`</${list}>`;list=null}};const open=k=>{if(list!==k){close();html+=`<${k}>`;list=k}};
  for(const raw of t.split('\n')){const l=raw.trimEnd();let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){close();html+=`<h4>${inl(m[1])}</h4>`}
    else if((m=l.match(/^\s*[-•*]\s+(.*)/))){open('ul');html+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){open('ol');html+=`<li>${inl(m[1])}</li>`}
    else if(!l.trim())close();else{close();html+=`<p>${inl(l)}</p>`}}
  close();return html}

function citeHTML(html){return html.replace(/\[s:(\d+):(\d+)\]/g,(m,a,b)=>{const nb=S.notebooks[+a-1];if(!nb)return '';return `<button type="button" class="cite" data-nb="${nb.id}" data-pg="${+b-1}">${esc(nb.title)} · str. ${+b}</button>`})}
function renderNotes(){const body=$('#notesBody');
  if(!NOTES.thread.length){body.innerHTML=`<p>Zeptej se na cokoli ze svých sešitů. Odpovím podle toho, co máš zapsané, a ukážu ti, na které stránce to najdeš.</p>
    <div class="row">${[L('Za 3 dny mám test z fyziky','I have a physics test in 3 days'),L('Co jsme brali o limitách?','What did we cover about limits?'),L('Jak se derivuje součin?','How do I differentiate a product?'),L('Shrň mi fyziku na test','Summarize physics for my test'),L('Kde mám chyby, které se opakují?','Which mistakes do I keep making?')].map(t=>`<button type="button" class="pill" data-sug="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;return}
  body.innerHTML=NOTES.thread.map(en=>`<div class="q">${esc(en.q)}</div><div class="a">${en.demo?'<span class="demo">Ukázka</span>':''}${en.text?citeHTML(md(en.text)):(en.done?'':'<div class="thinking"><span></span><span></span><span></span>Procházím zápisky…</div>')}${en.err?`<p class="err">${esc(en.err)}</p>`:''}${en.paywall?PAYWALL_HTML:''}</div>`).join('');body.scrollTop=body.scrollHeight}

async function askNotes(q){if(NOTES.ctl)NOTES.ctl.abort();const en={q,text:'',done:false};NOTES.thread.push(en);renderNotes();
  const sample=await SAMPLE_P;
  if(!sample){const hits=[];S.notebooks.forEach((nb,i)=>nb.pages.forEach((pg,j)=>{const t=norm(pageTyped(pg)+' '+(pg.ocr||''));if(norm(q).split(/\s+/).filter(w=>w.length>3).some(w=>t.includes(w.slice(0,Math.max(4,w.length-2)))))hits.push(`[s:${i+1}:${j+1}]`)}));
    {const tl=tmLocal(q);if(tl){const t=timerAdd(tl.minutes,tl.label);en.demo=true;en.done=true;en.text=L(`Minutka běží: **${t.label}**, zazvoní za ${Math.round(t.mins)} min. Odpočet vidíš vlevo dole.`,`Timer running: **${t.label}**, rings in ${Math.round(t.mins)} min. The countdown is in the bottom left.`);renderNotes();return}}
    {const ad=agHandle('',q);if(ad.length){en.demo=true;en.done=true;en.text=L(`Zapsal jsem si to do kalendáře: **${ad[0].title}**, ${agRel(ad[0])} (${agDate(ad[0])}). Připomenu ti to den předem i v den termínu.`,`Saved to your calendar: **${ad[0].title}**, ${agRel(ad[0])} (${agDate(ad[0])}). I'll remind you the day before and on the day.`);renderNotes();return}}
    en.demo=true;en.done=true;en.text=`AI tu není připojená, takže jen hledám podle slov. ${hits.length?'Tohle téma najdeš tady: '+hits.slice(0,6).join(' '):'Nic jsem nenašel.'}\n\nV aplikaci Claude ti pomocník odpoví vlastními slovy a se shrnutím.`;renderNotes();return}
  if(usageLeft()<=0){en.done=true;en.paywall=true;renderNotes();return}
  const t=NOTES.turns;const input=t.length?[{role:'user',content:notesPrompt(t[0].content)},...t.slice(1).slice(-6),{role:'user',content:q}]:notesPrompt(q);
  const ctl=new AbortController();NOTES.ctl=ctl;
  try{const res=await sample(input,{modelTier:S.profile.ai,signal:ctl.signal,cache:false,onText:({text})=>{en.text=text;if(NOTES.tap)try{NOTES.tap(cleanAns(text,true))}catch(e){}if(!notesRaf)notesRaf=requestAnimationFrame(()=>{notesRaf=0;renderNotes()})}});
    en.text=stripAg(res.text);NOTES.turns.push({role:'user',content:q},{role:'assistant',content:res.text});spendUsage();agHandle(res.text,q);if(S.prefs.autoRead&&!TALK.on)speak(en.text)}
  catch(e){if(!(e&&e.code==='cancelled'))en.err=errCopy(e&&e.code);en.text=e&&e.code!=='refused'&&e.text||en.text}
  finally{en.done=true;if(NOTES.ctl===ctl)NOTES.ctl=null;renderNotes()}}

let jspdfP=null;
function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf);if(!jspdfP)jspdfP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>window.jspdf?res(window.jspdf):rej();s.onerror=()=>{jspdfP=null;rej()};document.head.appendChild(s)});return jspdfP}
async function exportPDF(nb,btn){if(btn){btn.textContent='Připravuji PDF…';btn.disabled=true}
  try{const {jsPDF}=await loadJsPDF();let doc=null;
    for(const pg of nb.pages){const k=1.6,cv=document.createElement('canvas');cv.width=Math.round(W*k);cv.height=Math.round(pg.h*k);const c=cv.getContext('2d');c.scale(k,k);renderPage(c,nb,pg);const url=cv.toDataURL('image/jpeg',.88);
      const fmt=[W*.75,pg.h*.75];if(!doc)doc=new jsPDF({unit:'pt',format:fmt,orientation:'portrait'});else doc.addPage(fmt,'portrait');doc.addImage(url,'JPEG',0,0,fmt[0],fmt[1])}
    await saveFile(`${(nb.title||'sešit').replace(/[\\/:*?"<>|]/g,'')}.pdf`,doc.output('blob'))}
  catch(e){toast('PDF se nepodařilo vytvořit.',3500)}finally{if(btn&&btn.isConnected){btn.textContent='Exportovat PDF';btn.disabled=false}}}

function pagesSince(ids,since){let n=0;for(const nb of S.notebooks){if(!ids.has(nb.id))continue;for(const pg of nb.pages)if(!since||(pg.mod||nb.updated||0)>=since)n++}return n}
function localTopics(ids){const out=new Map(),add=(t,w)=>{t=String(t||'').replace(/^[#\d.)\s–-]+/,'').trim();if(t.length<3||t.length>40)return;const k=norm(t);out.set(k,{t,w:(out.get(k)?.w||0)+w})};
  for(const nb of S.notebooks){if(!ids.has(nb.id))continue;for(const t of (nb.topics||[]))add(t,5);
    for(const pg of nb.pages)for(const o of pg.objs)if(o.type==='text'&&o.size>=30&&o.text&&!o.text.includes('\n'))add(o.text,2)}
  for(const c of (S.review&&S.review.cards||[]))if(ids.has(c.nbId))add(c.topic,1);
  return [...out.values()].sort((a,b)=>b.w-a.w).slice(0,24).map(x=>x.t)}

function plainTex(t){t=String(t||'');for(let k=0;k<3;k++)t=t.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');
  const G={alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',sigma:'σ',Sigma:'Σ',omega:'ω',Omega:'Ω',phi:'φ',rho:'ρ',tau:'τ',xi:'ξ',cdot:'·',times:'×',to:'→',rightarrow:'→',infty:'∞',le:'≤',leq:'≤',ge:'≥',geq:'≥',neq:'≠',pm:'±',int:'∫',sum:'∑',approx:'≈',partial:'∂',in:'∈',forall:'∀',exists:'∃'};
  const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','n':'ⁿ','-':'⁻','+':'⁺'};
  return t.replace(/\$+/g,'').replace(/\\(left|right)/g,'').replace(/\\([a-zA-Z]+)/g,(m,w)=>G[w]!=null?G[w]:(/^(sin|cos|tan|ln|log|lim|max|min|exp)$/.test(w)?w:'')).replace(/\^\{([^{}]*)\}|\^(\S)/g,(m,a,b)=>{const v=a!=null?a:b;return [...v].every(c=>SUP[c])?[...v].map(c=>SUP[c]).join(''):'^('+v+')'}).replace(/_\{([^{}]*)\}/g,'_$1').replace(/[{}]/g,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim()}

function loadPptx(){if(window.PptxGenJS)return Promise.resolve(window.PptxGenJS);if(!pptxP)pptxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js';sc.onload=()=>window.PptxGenJS?res(window.PptxGenJS):rej();sc.onerror=()=>{pptxP=null;rej()};document.head.appendChild(sc)});return pptxP}
function deckColors(dk){const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0f7c6b';const hex=acc.startsWith('#')?acc.slice(1).padEnd(6,'0').slice(0,6):'0F7C6B';

const lvNeed=n=>100+50*(n-1);
function lvOf(total){let n=1,left=total;while(left>=lvNeed(n)){left-=lvNeed(n);n++}return {n,cur:left,need:lvNeed(n),p:Math.round(left/lvNeed(n)*100)}}
function XP(){const x=S.xp=S.xp||{};x.total=x.total||0;x.days=x.days||{};x.stat=x.stat||{};return x}
function addXP(n,why,quiet){if(!n)return;const x=XP(),k=dayKey(Date.now());const before=lvOf(x.total).n,dayBefore=x.days[k]||0;x.total+=n;x.days[k]=dayBefore+n;
  const ks=Object.keys(x.days);if(ks.length>40)ks.sort((a,b)=>new Date(a)-new Date(b)).slice(0,ks.length-40).forEach(z=>delete x.days[z]);save();
  if(!WB().gamify)return;const after=lvOf(x.total).n;renderXpChip();
  if(!quiet){const f=document.createElement('div');f.className='xpfloat';f.textContent=`+${n} XP${why?' · '+why:''}`;document.body.appendChild(f);setTimeout(()=>f.remove(),1700)}
  if(x.days[k]>=40&&!streakDoneToday()&&(!repairActive()||x.days[k]>=80))bumpStreak();if(!checkQuests.busy)checkQuests();
  if(after>before)setTimeout(()=>toast(L(`Úroveň ${after}! 🎉 Jen tak dál.`,`Level ${after}! 🎉 Keep it up.`),3500),600);
  else if(dayBefore<WB().goal&&x.days[k]>=WB().goal)setTimeout(()=>{toast(L('Denní cíl splněný ✓ Na dnešek to klidně stačí.','Daily goal done ✓ That\'s plenty for today.'),4000)},600)}

/* ---------- sdílené sešity a synchronizace mezi zařízeními (db) ---------- */
/* ===== Synchronizace přes Supabase: stejné API jako db v prototypu (doc/collection/onSnapshot) =====
   Tabulka docs(path, parent, data, deleted, seq). Co kdo smí vidět, hlídá databáze (RLS):
   data/users/<id>/… jen vlastník, shared/<sid>/… jen členové sdíleného sešitu.
   Novinky se stahují podle rostoucího pořadového čísla změny (seq), po stránkách, takže se nic neztratí. */
function accUserId(){try{const at=ACC.s&&ACC.s.at;if(!at)return null;return JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||null}catch(e){return null}}
function sbDb(){
  const ST={cols:new Map(),docs:new Map(),cache:new Map(),ready:new WeakSet(),seq:null,seen:new Map(),mine:new Map(),timer:0,members:new Set(),busy:false,started:false};
  const base=()=>KCFG.supabaseUrl+'/rest/v1/';const COLS='path,parent,data,deleted,seq';
  async function hdr(extra){const tok=await accToken();if(!tok)throw {code:'not_signed_in'};return Object.assign({apikey:KCFG.anonKey,authorization:'Bearer '+tok,'content-type':'application/json'},extra||{})}
  async function rest(path,opt){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);let r;
    try{r=await fetch(base()+path,Object.assign({},opt,{signal:ctl.signal,headers:await hdr(opt&&opt.headers)}))}catch(e){throw {code:'offline'}}finally{clearTimeout(to)}
    if(!r.ok){const t=await r.text().catch(()=>'');throw {code:r.status===401||r.status===403?'invalid_argument':'unavailable',detail:t.slice(0,200)}}const t=await r.text();return t?JSON.parse(t):null}
  const parentOf=p=>p.split('/').slice(0,-1).join('/'),idOf=p=>p.split('/').pop();
  const sidOf=p=>p.startsWith('shared/')?p.split('/')[1]:null;
  async function ensureMember(p){const sid=sidOf(p);if(!sid||ST.members.has(sid))return;
    await rest('shared_members?on_conflict=sid,user_id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({sid})});ST.members.add(sid)}
  const snapDoc=(path,row)=>({id:idOf(path),exists:!!row&&!row.deleted,data:()=>row&&!row.deleted?row.data:undefined});
  async function fetchAll(q){let out=[],from=0;for(;;){const rows=await rest(q+'&order=path.asc',{headers:{Range:`${from}-${from+999}`}});out=out.concat(rows||[]);if(!rows||rows.length<1000)break;from+=1000}return out}
  function deliver(cb,snap){if(!ST.ready.has(cb))return;try{cb(snap)}catch(e){console.error(e)}}
  function emitCol(parent,changes){const L=ST.cols.get(parent);if(!L||!L.size)return;const m=ST.cache.get(parent)||new Map();
    const docs=[...m.entries()].map(([id,row])=>snapDoc(parent+'/'+id,row));const snap={docs,empty:!docs.length,docChanges:()=>changes};for(const cb of L)deliver(cb,snap)}
  function apply(row){const mine=ST.mine.get(row.path);if(mine&&row.seq<mine)return; // starší ozvěna vlastního zápisu
    const parent=row.parent,id=idOf(row.path);
    if(ST.cols.has(parent)){const m=ST.cache.get(parent)||new Map();ST.cache.set(parent,m);const had=m.has(id);
      if(row.deleted){if(had){m.delete(id)}emitCol(parent,[{type:'removed',doc:snapDoc(row.path,null)}])}
      else{m.set(id,row);emitCol(parent,[{type:had?'modified':'added',doc:snapDoc(row.path,row)}])}}
    const DL=ST.docs.get(row.path);if(DL)for(const cb of DL)deliver(cb,snapDoc(row.path,row))}
  // novinky: po stránkách podle seq; malý přesah zpět chytí zápisy, které se potvrdily o chlup později
  async function poll(){if(ST.busy||ST.seq==null)return;ST.busy=true;try{if(!ACC.s)return;let from=Math.max(0,ST.seq-300);
      for(let page=0;page<50;page++){const rows=await rest(`docs?select=${COLS}&seq=gt.${from}&order=seq.asc&limit=1000`);
        for(const r of rows||[]){const k=r.path+'|'+r.seq;if(r.seq>ST.seq)ST.seq=r.seq;if(ST.seen.has(k))continue;ST.seen.set(k,1);apply(r)}
        if(!rows||rows.length<1000)break;from=rows[rows.length-1].seq}
      if(ST.seen.size>30000)ST.seen=new Map([...ST.seen].slice(-8000))}
    catch(e){}finally{ST.busy=false}}
  function loop(){clearTimeout(ST.timer);ST.timer=setTimeout(async()=>{await poll();loop()},document.hidden?30000:3000)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ST.started){poll();loop()}});
  async function start(){if(ST.started)return;ST.started=true;try{const r=await rest('rpc/docs_last_seq',{method:'POST',body:'{}'});ST.seq=+r||0}catch(e){ST.started=false;throw e}loop()}
  async function loadCol(parent){const rows=await fetchAll(`docs?select=${COLS}&parent=eq.${encodeURIComponent(parent)}`);const m=new Map(),dead=[];
    for(const r of rows){ST.seen.set(r.path+'|'+r.seq,1);if(r.deleted)dead.push(r);else m.set(idOf(r.path),r)}ST.cache.set(parent,m);return {m,dead}}
  function firstSnap(parent,res){const docs=[...res.m.entries()].map(([id,row])=>snapDoc(parent+'/'+id,row));
    // smazané věci pošleme jako "removed", ať je zařízení, které bylo offline, taky smaže
    return {docs,empty:!docs.length,docChanges:()=>docs.map(doc=>({type:'added',doc})).concat(res.dead.map(r=>({type:'removed',doc:snapDoc(r.path,null)})))}}
  async function write(path,body){await ensureMember(path);const rows=await rest('docs?on_conflict=path&select=seq',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
    const sq=rows&&rows[0]&&rows[0].seq;if(sq)ST.mine.set(path,sq)}
  const db={
    doc(path){return {
      set(data){return write(path,{path,parent:parentOf(path),data,deleted:false})},
      delete(){return write(path,{path,parent:parentOf(path),data:null,deleted:true})},
      async get(){const rows=await rest(`docs?select=${COLS}&path=eq.${encodeURIComponent(path)}`);return snapDoc(path,rows&&rows[0])},
      onSnapshot(cb,err){let L=ST.docs.get(path);if(!L){L=new Set();ST.docs.set(path,L)}L.add(cb);
        const go=async(n)=>{try{await start();await ensureMember(path);const rows=await rest(`docs?select=${COLS}&path=eq.${encodeURIComponent(path)}`);if(!L.has(cb))return;ST.ready.add(cb);cb(snapDoc(path,rows&&rows[0]))}
          catch(e){if(L.has(cb)&&ACC.s&&n<20)setTimeout(()=>go(n+1),Math.min(60000,3000*(n+1)));else err&&err(e)}};go(0);
        return ()=>L.delete(cb)}}},
    collection(parent){return {
      onSnapshot(cb,err){let L=ST.cols.get(parent);if(!L){L=new Set();ST.cols.set(parent,L)}L.add(cb);
        const go=async(n)=>{try{await start();if(parent.startsWith('shared/'))await ensureMember(parent+'/x');const res=await loadCol(parent);if(!L.has(cb))return;ST.ready.add(cb);cb(firstSnap(parent,res));poll()}
          catch(e){if(L.has(cb)&&ACC.s&&n<20)setTimeout(()=>go(n+1),Math.min(60000,3000*(n+1)));else err&&err(e)}};go(0);
        return ()=>L.delete(cb)}}},
    // připojení ke sdílenému sešitu (odkaz nebo kód) a znovunačtení seznamu
    async join(sid){await ensureMember('shared/'+sid);const L=ST.cols.get('shared');if(L&&L.size){await loadCol('shared');emitCol('shared',[])}},
    // po přihlášení: načíst znovu všechno, co appka sleduje
    async reload(){ST.members.clear();ST.started=false;ST.seq=null;await start();
      for(const parent of [...ST.cols.keys()]){try{if(parent.startsWith('shared/'))await ensureMember(parent+'/x');const res=await loadCol(parent);const snap=firstSnap(parent,res);for(const cb of ST.cols.get(parent)){ST.ready.add(cb);try{cb(snap)}catch(e){}}}catch(e){}}
      for(const [path,L] of ST.docs){try{const d=await db.doc(path).get();for(const cb of L){ST.ready.add(cb);cb(d)}}catch(e){}}}};
  return db}

const DB_P=HAS_CLAUDE?window.claude.use('db').catch(()=>null):(HAS_API?Promise.resolve(sbDb()):Promise.resolve(null));
const USER_P=HAS_CLAUDE?window.claude.use('user').catch(()=>null):(HAS_API?Promise.resolve({id:async()=>accUserId()}):Promise.resolve(null));
const ME={id:null};const SYNC={on:false,seen:new Set(),lastState:'',stT:0,ready:false};
const SHR={subs:new Map(),last:new Map(),ids:new Map(),list:[],pushT:new Map(),q:new Map(),meta:new Map(),warned:false};
function nbBase(nb){if(nb.shared)return 'shared/'+nb.shared.sid;if(nb.cloud&&ME.id)return `data/users/${ME.id}/nb_${nb.cloud}`;return null}
function writeQ(key,fn){const prev=SHR.q.get(key)||Promise.resolve();const n=prev.then(fn).then(()=>{SHR.fails=0},e=>{
    if(e&&e.code==='invalid_argument'){if(!SHR.warned){SHR.warned=true;toast(L('Sem nemůžeš zapisovat. Požádej o přístup s úpravami.','You cannot write here. Ask for edit access.'),4200)}return}
    // zapomenout, že se to odeslalo, a za chvíli poslat znovu
    SHR.last.delete(key);if(key.startsWith('meta/'))SHR.meta.delete(key.slice(5));if(key==='state')SYNC.lastState='';syncRetry()});SHR.q.set(key,n);return n}
function syncRetry(){if(SHR.retryT)return;SHR.fails=(SHR.fails||0)+1;if(SHR.fails===3)toast(L('Synchronizace se teď nedaří – zkouším to znovu, nic se neztratí.','Sync is not working right now – retrying, nothing is lost.'),4000);
  SHR.retryT=setTimeout(()=>{SHR.retryT=0;S.notebooks.forEach(nb=>{if(nbBase(nb))schedulePush(nb)});if(SYNC.on)schedulePushState()},Math.min(60000,4000*Math.pow(1.6,Math.min(8,SHR.fails))))}
function metaOf(nb){return {title:nb.title,subject:nb.subject||'',cover:nb.cover,paper:nb.paper,layout:nb.layout,layers:nb.layers||[],pages:nb.pages.map(p=>({id:p.id,h:Math.round(p.h),mod:p.mod||0}))}}
function shrinkSrc(src,max){return new Promise(res=>{const im=new Image();im.onload=()=>{let k=Math.min(1,900/Math.max(im.width,im.height)),q=.72,out=src;for(let i=0;i<5;i++){const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);if(out.length<max)break;k*=.75;q=Math.max(.5,q-.08)}res(out)};im.onerror=()=>res(src);im.src=src})}
function schedulePush(nb){clearTimeout(SHR.pushT.get(nb.id));SHR.pushT.set(nb.id,setTimeout(()=>pushShared(nb),450))}
async function pushShared(nb){const db=await DB_P;const base=nbBase(nb);if(!db||!base)return;const known=SHR.ids.get(base)||new Set();SHR.ids.set(base,known);const present=new Set();
  for(const pg of nb.pages)for(const o of pg.objs){present.add(o.id);let j=JSON.stringify(o,replacer);
    if(j.length>230000&&o.type==='image'){o.src=await shrinkSrc(o.src,200000);j=JSON.stringify(o,replacer)}if(j.length>230000)continue;
    const key=base+'/'+o.id,sig=j+'|'+pg.id;if(SHR.last.get(key)===sig)continue;SHR.last.set(key,sig);known.add(o.id);writeQ(key,()=>db.doc(`${base}/objs/${o.id}`).set({p:pg.id,j}))}
  for(const id of [...known])if(!present.has(id)){known.delete(id);const key=base+'/'+id;SHR.last.delete(key);writeQ(key,()=>db.doc(`${base}/objs/${id}`).delete())}
  const m=metaOf(nb),mj=JSON.stringify(m);if(SHR.meta.get(base)!==mj){SHR.meta.set(base,mj);writeQ('meta/'+base,()=>db.doc(base).set(Object.assign({updated:Date.now()},m)))}}
function refreshShared(nb,pages){if(ED&&ED.nb===nb&&!$('#ed').hidden){if(!pages||ED.views.length!==nb.pages.length){const st=$('#scroller').scrollTop;clearSel();buildPages();$('#scroller').scrollTop=st}else ED.views.forEach(v=>{if(pages.has(v.pg)){redrawBase(v);liveRender(v)}})}else if(!$('#lib').hidden)renderLib()}
function subscribeShared(nb){const base=nbBase(nb);if(!base||SHR.subs.has(base))return;SHR.subs.set(base,[]);DB_P.then(db=>{if(!db)return;
  const u1=db.collection(`${base}/objs`).onSnapshot(snap=>{const touched=new Set();const known=SHR.ids.get(base)||new Set();SHR.ids.set(base,known);
    for(const ch of snap.docChanges()){const id=ch.doc.id,key=base+'/'+id;
      if(ch.type==='removed'){known.delete(id);SHR.last.delete(key);for(const pg of nb.pages){const i=pg.objs.findIndex(o=>o.id===id);if(i>=0){pg.objs.splice(i,1);touched.add(pg)}}continue}
      const d=ch.doc.data()||{};const j=String(d.j||''),sig=j+'|'+d.p;known.add(id);if(SHR.last.get(key)===sig)continue;SHR.last.set(key,sig);let o;try{o=JSON.parse(j)}catch(e){continue}
      for(const p2 of nb.pages){const i=p2.objs.findIndex(x=>x.id===id);if(i>=0){p2.objs.splice(i,1);touched.add(p2)}}
      let pg=nb.pages.find(p=>p.id===d.p);if(!pg){pg={id:String(d.p),h:H,objs:[],rev:0,ocr:'',ocrRev:0};nb.pages.push(pg)}pg.objs.push(o);touched.add(pg)}
    if(touched.size){touched.forEach(pg=>pg.rev=(pg.rev||0)+1);nb.updated=Date.now();thumbs.delete(nb.id);save();refreshShared(nb,touched)}},()=>{});
  const u2=db.doc(base).onSnapshot(sn=>{if(!sn.exists)return;const m=sn.data()||{};if(m.deleted)return;let ch=false;
    if(m.title&&m.title!==nb.title){nb.title=m.title;ch=true;if(ED&&ED.nb===nb)$('#edTitle').value=nb.title}
    for(const k of ['subject','cover','paper','layout'])if(m[k]!=null&&JSON.stringify(m[k])!==JSON.stringify(nb[k])){nb[k]=m[k];ch=true}
    if(Array.isArray(m.layers)){const lv=m.layers.length>1?m.layers:null;if(JSON.stringify(lv)!==JSON.stringify(nb.layers||null)){if(lv)nb.layers=lv;else delete nb.layers;ch=true;if(ED&&ED.nb===nb){ED.layer=Math.min(ED.layer||0,lv?lv.length-1:0);renderTools()}}}
    for(const p of (m.pages||[])){const pg=nb.pages.find(x=>x.id===p.id);if(!pg){nb.pages.push({id:String(p.id),h:p.h||H,objs:[],rev:0,ocr:'',ocrRev:0,mod:p.mod||0});ch=true}else{if(p.h>pg.h){pg.h=p.h;ch=true}if((p.mod||0)>(pg.mod||0))pg.mod=p.mod}}
    SHR.meta.set(base,JSON.stringify(metaOf(nb)));if(ch){thumbs.delete(nb.id);save();refreshShared(nb,null)}},()=>{});
  SHR.subs.set(base,[u1,u2])})}
function unsubscribeBase(base){const u=SHR.subs.get(base);if(u)u.forEach(f=>{try{f()}catch(e){}});SHR.subs.delete(base)}
function cloudDelete(nb){const base=nbBase(nb);if(!base)return;DB_P.then(db=>{if(!db)return;unsubscribeBase(base);const known=SHR.ids.get(base)||new Set();
  if(nb.shared)return;writeQ('meta/'+base,()=>db.doc(base).set({deleted:true,updated:Date.now()}));for(const id of known)writeQ(base+'/'+id,()=>db.doc(`${base}/objs/${id}`).delete())})}
function watchSharedList(){DB_P.then(db=>{if(!db)return;db.collection('shared').onSnapshot(snap=>{SHR.list=snap.docs.map(d=>Object.assign({sid:d.id},d.data()));if(!$('#lib').hidden)renderSharedSec()},()=>{})})}

  if(st.profile)S.profile=Object.assign(S.profile,st.profile);if(st.prefs){const keep={fab:S.prefs.fab,hinted:S.prefs.hinted};S.prefs=Object.assign(S.prefs,st.prefs,keep)}

  if(Array.isArray(st.timers)){const m=new Map(TMRAW().map(t=>[t.id,t]));for(const t of st.timers){const l=m.get(t.id);if(!l||(t.upd||0)>(l.upd||0))m.set(t.id,Object.assign({},t,{rang:l?l.rang:t.end<=Date.now()}))}S.timers=[...m.values()];try{renderTimers()}catch(e){}}
  if(st.xp){const x=XP(),r=st.xp;x.total=Math.max(x.total,r.total||0);x.breaks=Math.max(x.breaks||0,r.breaks||0);for(const k in r.days||{})x.days[k]=Math.max(x.days[k]||0,r.days[k]);for(const k in r.stat||{})x.stat[k]=Math.max(x.stat[k]||0,r.stat[k])}
  migrate();applyLook();try{localStorage.setItem(KEY,JSON.stringify(S,replacer))}catch(e){}idbSet(KEY,JSON.stringify(S,replacer));if(!$('#lib').hidden)renderLib()}
async function initCloud(){const [db,user]=await Promise.all([DB_P,USER_P]);if(!db||!user)return;let id=null;try{id=await user.id()}catch(e){}if(!id)return;ME.id=id;SYNC.on=true;

function voiceScore(v){let s=0;const lc=LANGS[LANG()].loc;if(v.lang.replace('_','-').toLowerCase()===lc.toLowerCase()||(LANG()==='en'&&/^en-(US|GB)/i.test(v.lang)))s+=100;else if(v.lang.slice(0,2).toLowerCase()===LANG())s+=60;else if(LANG()==='cs'&&/^sk/i.test(v.lang))s+=40;if(/premium|enhanced|vylepš|natural|neural|online|siri/i.test(v.name))s+=30;if(/google/i.test(v.name))s+=12;if(!v.localService)s+=4;return s}
function voiceList(){const cz=VOICE.list.filter(v=>String(v.lang).slice(0,2).toLowerCase()===LANG()||(LANG()==='cs'&&/^sk/i.test(v.lang)));return cz.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))}

function makeUtts(text){const t=speakable(text);if(!t)return [];const parts=[];let cur='';for(const s of t.match(/[^.!?…:;]+[.!?…:;]*\s*/g)||[t]){if((cur+s).length>220&&cur){parts.push(cur);cur=s}else cur+=s}if(cur.trim())parts.push(cur);

function trStr(t){if(!ENB()||!t)return null;const k=t.trim();if(!k)return null;let v=EN[k];if(v!=null)return v===k?null:t.replace(k,v);for(const [rx,f] of EN_RX){const m=k.match(rx);if(m){const r=f(...m);return r===k?null:t.replace(k,r)}}return null}
const TR_SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','CODE']);
/* 2. vrstva: angličtina -> další jazyky, přeloží AI jednou a uloží v zařízení */
const TR2=!['en','cs'].includes(LANG());const TR2_SKIP='mjx-container,.no-tr,.a,.qtext,.qopt,.qexp,.flash,.slide,.deck-notes,.deck-thumbs,.cite,.textedit,.nb-title,.card-title,[data-open] b,.q,#notesBody .a,#aiBody,#results,.nb-meta b,.nb-open,.ag-it b,.tmr span,#edTitle,.quest b+.xp-bar';
let TRC={};const TRQ=new Set(),TRBAD=new Set(),DONE=new WeakMap(),ORIG=new WeakMap();let trT=0,trBusy=false,trSent=0;
if(TR2){try{TRC=JSON.parse(localStorage.getItem('krouzek-tr-'+LANG())||'{}')||{}}catch(e){TRC={}}}
function tr2(en,force){const k=en.trim();if(!k||!/\p{L}{2}/u.test(k)||/^(Loopnote|Loopnote Plus|XP|AI|PDF|K)$/.test(k))return en;const v=TRC[k];if(v)return en.replace(k,v);if((force||UIS.has(k))&&!TRBAD.has(k)&&k.length<400){TRQ.add(k);schedTr()}return en}
function trText(n){const cur=n.nodeValue;if(DONE.get(n)===cur)return;const par=n.parentNode;if(!par||TR_SKIP.has(par.nodeName)||(par.closest&&par.closest('mjx-container,.no-tr')))return;
  const r1=trStr(cur);let en=r1!=null?r1:cur;if(TR2&&!(par.closest&&par.closest(TR2_SKIP))){ORIG.set(n,en);en=tr2(en,true)}if(en!==cur){n.nodeValue=en;DONE.set(n,en)}}
function trAttr(el){for(const a of ['placeholder','aria-label','title']){const v=el.getAttribute&&el.getAttribute(a);if(!v)continue;const key='__tr_'+a;if(el[key]===v)continue;const r1=trStr(v);let en=r1!=null?r1:v;if(TR2){(el.__orig=el.__orig||{})[a]=en;en=tr2(en,true)}if(en!==v)el.setAttribute(a,en);el[key]=en}}
function trEl(el){if(el.nodeType===3)return trText(el);if(el.nodeType!==1||TR_SKIP.has(el.nodeName)||(el.closest&&el.closest('mjx-container,.no-tr')))return;trAttr(el);
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&(n.nodeName==='MJX-CONTAINER'||n.classList&&n.classList.contains('no-tr'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while((n=w.nextNode())){if(n.nodeType===3)trText(n);else trAttr(n)}}
function schedTr(){if(trT||trBusy)return;trT=setTimeout(runTr,600)}
async function runTr(){trT=0;if(!TRQ.size)return;const sample=await SAMPLE_P;if(!sample){if(!runTr.warned){runTr.warned=true;setTimeout(()=>toast(`${LANGS[LANG()].n}: AI translation is not available here yet – showing English.`,5000),1200)}TRQ.clear();return}
  if(trSent>2500){TRQ.clear();return}const list=[...TRQ].filter(k=>!TRC[k]).slice(0,90);list.forEach(k=>TRQ.delete(k));if(!list.length)return;trBusy=true;trSent+=list.length;const ind=$('#trInd');if(ind)ind.hidden=false;
  try{const r=await sample.json(`Translate these user-interface strings of "Loopnote", a study app (smart notebook with an AI tutor for school and university students), from English to ${LANGS[LANG()].ai}. Use short, natural, friendly wording as in a polished mobile app, informal "you". Keep numbers, emoji, symbols, math, units and the names Loopnote, Loopnote Plus, AI, PDF, XP, Google, Apple unchanged. Keep leading/trailing punctuation. Return only JSON {"t":[...]} with exactly ${list.length} translations in the same order.\n\n${JSON.stringify(list)}`,{modelTier:'quick',purpose:'ui'});
    const out=r&&Array.isArray(r.t)?r.t:[];list.forEach((k,i)=>{const v=out[i];if(typeof v==='string'&&v.trim())TRC[k]=v.trim();else TRBAD.add(k)});try{localStorage.setItem('krouzek-tr-'+LANG(),JSON.stringify(TRC))}catch(e){}retranslate()}
  catch(e){list.forEach(k=>TRBAD.add(k))}finally{trBusy=false;const ind=$('#trInd');if(ind)ind.hidden=true;if(TRQ.size)schedTr()}}
function retranslate(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;while((n=w.nextNode())){if(n.nodeType===3){const en=ORIG.get(n);if(en!=null&&(DONE.get(n)===n.nodeValue||n.nodeValue===en)){const k=en.trim();if(TRC[k]){const v=en.replace(k,TRC[k]);if(v!==n.nodeValue){n.nodeValue=v;DONE.set(n,v)}}}}
  else if(n.__orig){for(const [a,en] of Object.entries(n.__orig)){const k=en.trim();if(TRC[k]){const v=en.replace(k,TRC[k]);n.setAttribute(a,v);n['__tr_'+a]=v}}}}}
if(ENB()){document.documentElement.lang=LANG();if(TR2){const ind=document.createElement('div');ind.id='trInd';ind.hidden=true;ind.className='no-tr';ind.textContent='⋯ '+LANGS[LANG()].n;ind.style.cssText='position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)';document.body.appendChild(ind)}
  trEl(document.body);new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trEl(m.target);else if(m.type==='attributes')trAttr(m.target);else m.addedNodes.forEach(n=>trEl(n))}}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']})}
function setLang(l){S.prefs.lang=l;S.prefs.reseed=true;S.savedAt=Date.now();const j=JSON.stringify(S,replacer);try{localStorage.setItem(KEY,j)}catch(e){}idbSet(KEY,j).then(()=>location.reload());setTimeout(()=>location.reload(),900)}

function reseedLang(){if(!S.prefs.reseed)return;delete S.prefs.reseed;const fresh=seedNotebooks();let i=0,n=0;
  for(const nb of S.notebooks){if(!nb.seed)continue;const f=fresh[i++];if(!f||nb.edited||nb.shared)continue;nb.title=f.title;nb.subject=f.subject;nb.pages.forEach((pg,j)=>{if(f.pages[j]){pg.objs=f.pages[j].objs;pg.rev=(pg.rev||0)+1}});touch(nb);n++}
  const E=ENB(),map=E?{'Limity':'Limits','Derivace':'Derivatives','Ostatní':'Other'}:{'Limits':'Limity','Derivatives':'Derivace','Other':'Ostatní'};
  if(n&&S.review){const fr=seedReview();const cur=S.prefs.lang;S.prefs.lang=cur==='en'?'cs':'en';const old=seedReview();S.prefs.lang=cur;
    S.review.cards.forEach(c=>{const i=old.cards.findIndex(x=>x.q===c.q);if(i>=0&&fr.cards[i]){c.q=fr.cards[i].q;c.a=fr.cards[i].a;c.topic=fr.cards[i].topic}else if(map[c.topic])c.topic=map[c.topic]});
    for(const st of Object.values(S.review.stats||{}))for(const [k,v] of Object.entries(st))if(map[k]){st[map[k]]=v;delete st[k]}}
  save()}

    set('thinking');const ackP=vxAck();let q='';try{q=await vxTranscribe(r.wav)}catch(e){if(!live())break;set('error',errCopy(e&&e.code));break}
    if(!live())break;if(!q){if(++misses>=2)break;continue}misses=0;set('heard',q);

    try{text=await ask(q,t=>ss.feed(t))}catch(e){ss.end('');stopSpeak();if(!live())break;set('error',errCopy(e&&e.code));break}
    if(!live()){ss.end('');break}if(!text){ss.end('');stopSpeak();continue}ss.end(text);set('speaking',text);await ss.done}
  if(TALK.sid===sid){TALK.on=false;vxMicOff();set('off')}}

async function lecPersist(c){try{await idbSet('rec:'+c.id,new Blob(c.chunks,{type:c.type}));if(c.segs.length)await idbSet('recseg:'+c.id,c.segs.slice())}catch(e){}}
function lecSegStart(c){if(!c.on)return;const r=lecRec(c.stream),parts=[];c.pend++;c.seg=r;
  r.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
  r.onstop=()=>{if(parts.length){c.segs.push(new Blob(parts,{type:r.mimeType||c.type}));lecPersist(c)}c.pend--;if(c.on&&!r._rot)lecStop(c);else lecMaybeSave(c)};
  r.start();clearTimeout(c.segT);c.segT=setTimeout(()=>{if(c.on&&r.state==='recording'){r._rot=true;r.stop();lecSegStart(c)}},120000)}
async function lecStart(){if(!ED||lecOn())return;if(LREC.cur&&LREC.cur.pend>0)return;let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}})}catch(e){toast(L('Nemám přístup k mikrofonu. Povol ho v nastavení.','No microphone access. Allow it in settings.'),4000);return}
  recAudio().pause();const nb=ED.nb,id=uid(),t0=Date.now();
  const c={on:true,id,nb,t0,stream:st,chunks:[],segs:[],pend:0,type:lecMime()||'audio/webm',saved:false,stopping:false};LREC.cur=c;
  // záznam hned v sešitě, ať je vidět i kdyby se appka zavřela
  const d=new Date(t0);nb.recs=nb.recs||[];nb.recs.push({id,name:L('Přednáška ','Lecture ')+d.toLocaleDateString(LOC())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),added:t0,live:1,recording:1});touch(nb);
  const mr=lecRec(st);c.mr=mr;c.type=mr.mimeType||c.type;c.pend++;
  mr.ondataavailable=e=>{if(e.data&&e.data.size){c.chunks.push(e.data);if(c.chunks.length%6===0)lecPersist(c)}}; // každých ~30 s uložit
  mr.onstop=()=>{c.pend--;if(c.on)lecStop(c);else lecMaybeSave(c)};mr.start(5000);lecSegStart(c);
  st.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>lecStop(c))); // hovor, odpojený mikrofon…
  try{if(navigator.wakeLock)c.wake=await navigator.wakeLock.request('screen')}catch(e){}
  c.timer=setInterval(()=>{const b=document.querySelector('[data-lec="rec"]');if(b)b.textContent='■ '+fmtT((Date.now()-c.t0)/1000)},1000);renderRecBar();
  toast(L('Nahrávám. Piš poznámky – každá se spojí s místem v nahrávce. Nech appku otevřenou.','Recording. Take notes – each one links to that moment. Keep the app open.'),4500)}
function lecStop(c){c=c||LREC.cur;if(!c||!c.on)return;c.on=false;clearInterval(c.timer);clearTimeout(c.segT);try{c.mr.state!=='inactive'&&c.mr.stop()}catch(e){}try{c.seg&&c.seg.state!=='inactive'&&c.seg.stop()}catch(e){}
  try{c.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{c.wake&&c.wake.release()}catch(e){}renderRecBar();lecMaybeSave(c)}
async function lecMaybeSave(c){if(c.on||c.pend>0||c.saved)return;c.saved=true;await lecPersist(c);const nb=c.nb,rec=(nb.recs||[]).find(r=>r.id===c.id);
  if(rec){delete rec.recording;rec.dur=Math.round((Date.now()-c.t0)/1000)}touch(nb);if(ED&&ED.nb===nb){await loadRec(c.id);renderRecBar()}
  toast(c.chunks.length?L('Nahrávka uložená. Můžeš z ní nechat udělat zápis.','Recording saved. You can turn it into notes.'):L('Nahrávka je prázdná.','The recording is empty.'),4000)}

setTimeout(()=>{try{for(const nb of S.notebooks)for(const r of nb.recs||[])if(r.recording&&!(LREC.cur&&LREC.cur.id===r.id)){delete r.recording;r.cut=1}}catch(e){}},0);
function pcmRms(a){let s=0,n=0;for(let i=0;i<a.length;i+=8){s+=a[i]*a[i];n++}return Math.sqrt(s/Math.max(1,n))}
async function lecDecode(blob,sr){const AC=window.AudioContext||window.webkitAudioContext;let ac;try{ac=new AC({sampleRate:sr})}catch(e){ac=new AC()}
  try{const au=await ac.decodeAudioData(await blob.arrayBuffer());const n=au.length,out=new Float32Array(n);for(let c=0;c<au.numberOfChannels;c++){const d=au.getChannelData(c);for(let i=0;i<n;i++)out[i]+=d[i]/au.numberOfChannels}return {pcm:out,sr:au.sampleRate}}finally{ac.close().catch(()=>{})}}
async function lecNotes(){if(!ED||!REC.id||LREC.busy)return;const nb=ED.nb,rid=REC.id,rec=(nb.recs||[]).find(r=>r.id===rid);if(usageLeft()<=0){plansDialog();return}
  const ctl={stop:false};LREC.ctl=ctl;const set=t=>{LREC.busy=t;renderRecBar()};let text=rec&&rec.transcript||'',gaps=0;
  try{if(!text){set(L('Načítám nahrávku…','Loading the recording…'));const segs=await idbGet('recseg:'+rid);const pieces=[];const SEC=120;
      const cut=(pcm,sr,at)=>{for(let i=0;i*SEC*sr<pcm.length;i++)pieces.push({at:at+i*SEC,pcm:pcm.subarray(i*SEC*sr,Math.min(pcm.length,(i+1)*SEC*sr)),sr})};
      if(Array.isArray(segs)&&segs.length){let at=0;for(const b of segs){pieces.push({at,blob:b});at+=SEC}}
      else{const blob=await idbGet('rec:'+rid);if(!blob){toast(L('Nahrávka se nenašla.','Recording not found.'));return}
        if(blob.size>120e6){toast(L('Nahrávka je moc velká (víc než 120 MB). Nahraj ji radši rovnou v appce.','The recording is too large (over 120 MB). Record it directly in the app instead.'),5000);return}
        const all=await lecDecode(blob,12000);cut(all.pcm,all.sr,0)}
      for(let i=0;i<pieces.length;i++){if(ctl.stop)throw {code:'cancelled'};set(L(`Přepisuji ${i+1}/${pieces.length}…`,`Transcribing ${i+1}/${pieces.length}…`));let p=pieces[i];
        if(p.blob){let d;try{d=await lecDecode(p.blob,16000)}catch(e){gaps++;continue}if(d.pcm.length>SEC*1.2*d.sr){const n0=pieces.length;cut(d.pcm,d.sr,p.at);const extra=pieces.splice(n0);pieces.splice(i,1,...extra);p=pieces[i]}else p={at:p.at,pcm:d.pcm,sr:d.sr}}
        if(pcmRms(p.pcm)<.002)continue;const wav=encWav([p.pcm],p.sr);let t='',err=null;
        for(let k=0;k<2&&!t;k++){try{t=await vxTranscribe(wav)}catch(e){err=e;if(e&&(e.code==='usage'||e.code==='cancelled'))throw e}}
        if(!t&&err){if(i===0)throw err;gaps++}if(t)text+=`[${fmtT(p.at)}] ${t}\n`}
      if(!text.trim()){toast(L('V nahrávce není slyšet řeč.','No speech found in the recording.'),4000);return}
      if(rec&&!gaps){rec.transcript=text;touch(nb)}} // neúplný přepis neukládat, ať se příště zkusí celý
    if(ctl.stop)throw {code:'cancelled'};set(L('Píšu zápis a kartičky…','Writing notes and flashcards…'));const sample=await SAMPLE_P;if(!sample)throw {code:'offline'};
    const r=await sample.json(`${TEACHER()}
${profileCtx(nb)}
JAK MLUVIT: ${styleGuide()}
Níže je přepis přednášky (s časy v hranatých závorkách). Udělej z něj přehledný studijní zápis do sešitu „${nb.title}“: hlavní témata jako sekce "## …", pod nimi odrážky "- " s tím podstatným, definice, vzorce (znaky Unicode jako x², √, π, ·, žádný LaTeX), důležité příklady a na konci "## Co si zapamatovat" se 3–6 body. Vynech omáčku, organizační věci a opakování. Piš jazykem přednášky. ${NO_CHAT}
Potom vytvoř 6–10 kartiček na opakování. ${GEN_RULE}
Odpověz jen JSON: {"title":"krátký název přednášky","notes":"zápis v markdownu","cards":[{"q":"otázka","a":"krátká odpověď","topic":"krátké téma"}]}

PŘEPIS:
${text.slice(0,200000)}`,{modelTier:S.profile.ai==='quick'?'default':S.profile.ai});spendUsage();
    if(ctl.stop)throw {code:'cancelled'};if(!r||!r.notes)throw {code:'invalid_json'};const pi=appendNote(nb,mdToNote(String(r.notes),String(r.title||rec&&rec.name||'')));let nc=0;
    (Array.isArray(r.cards)?r.cards:[]).filter(c=>c&&c.q&&c.a).slice(0,12).forEach(c=>{addCard({nbId:nb.id,q:String(c.q),a:String(c.a),topic:String(c.topic||nb.title).slice(0,40),src:`[s:${S.notebooks.indexOf(nb)+1}:${pi+1}]`});nc++});
    nb.edited=true;touch(nb);save();if(ED&&ED.nb===nb){refreshEdPages();const v=ED.views[pi];if(v)v.wrap.scrollIntoView({behavior:'smooth',block:'start'})}
    toast(L(`Hotovo: zápis na straně ${pi+1} a ${nc} kartiček do opakování.`,`Done: notes on page ${pi+1} and ${nc} flashcards for review.`)+(gaps?' '+L(`(${gaps} kousků nahrávky se nepodařilo přepsat.)`,`(${gaps} parts could not be transcribed.)`):''),5500)}
  catch(e){if(!(e&&e.code==='cancelled'))toast(errCopy(e&&e.code),5000)}finally{LREC.busy=null;LREC.ctl=null;renderRecBar()}}

[[KRESLI {"items":[{"type":"circle","box":[ymin,xmin,ymax,xmax],"color":"red"}]}]]
type: circle (zakroužkovat), underline (podtrhnout), arrow (šipka k místu), box (orámovat), check (fajfka – správně), cross (křížek – chyba), text (krátká poznámka rukou vedle místa, pole "text", max 30 znaků). box = přesné místo na obrázku v souřadnicích 0–1000 (ymin, xmin, ymax, xmax) – stejně jako když hledáš objekty na obrázku. color: red, green, blue nebo yellow. 1–4 položky. Pak teprve mluv a na nakreslené přirozeně odkaž („tady, co jsem zakroužkoval…“). Když na obrazovce opravdu není co ukázat (obecná otázka), řádek vynech.`:'Teď obrazovku nevidíš, nic nekresli.'}
${AG_RULE(false)}`;
  const input=history&&history.length?[{role:'user',content:sys},...history.slice(-8),{role:'user',content:q}]:sys+'\n\nSTUDENT ŘÍKÁ: '+q;
  const r=await sample(input,{images:imgs,modelTier:S.profile.ai||'default',onText:onRaw?({text})=>onRaw(text):undefined});spendUsage();return String(r.text||'').trim()}
/* čtení kreslicího příkazu: tolerantní k tomu, jak ho AI napíše (box / box_2d, s ```json, s textem kolem) */
function drawItems(raw){raw=String(raw||'');const i=raw.search(/\[\[\s*KRESLI/i);if(i<0)return [];const st=raw.indexOf('{',i);if(st<0)return [];
  let d=0,inS=false,esc2=false,end=-1;for(let k=st;k<raw.length;k++){const c=raw[k];if(inS){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inS=false;continue}
    if(c==='"')inS=true;else if(c==='{')d++;else if(c==='}'){d--;if(!d){end=k;break}}}if(end<0)return [];
  let o;try{o=JSON.parse(raw.slice(st,end+1))}catch(e){return []}const arr=Array.isArray(o)?o:(o.items||o.shapes||o.draw||[]);const T=['circle','underline','arrow','box','check','cross','text'];
  const AL={kruh:'circle',ellipse:'circle',oval:'circle',podtrhnout:'underline',line:'underline',sipka:'arrow',rect:'box',rectangle:'box',ramecek:'box',tick:'check',ok:'check',x:'cross',wrong:'cross',note:'text',label:'text'};
  return arr.map(x=>{if(!x)return null;let t=String(x.type||'').toLowerCase();t=T.includes(t)?t:AL[norm(t)]||null;let b=x.box||x.box_2d||x.bbox;
      if(b&&!Array.isArray(b)&&typeof b==='object')b=[b.ymin,b.xmin,b.ymax,b.xmax];if(!t||!Array.isArray(b)||b.length!==4)return null;b=b.map(n=>+n||0);
      if(b.every(n=>n<=1.001))b=b.map(n=>n*1000); // někdy píše 0–1
      return {type:t,box:b.map(n=>Math.max(0,Math.min(1000,n))),color:x.color,text:String(x.text||x.label||'').slice(0,40)}}).filter(Boolean).slice(0,6)}
function deskImg(url){return new Promise(r=>{if(!url){r(null);return}const im=new Image();im.onload=()=>r({url,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>r(null);im.src=url})}
async function deskAnswer(url,q,history,onText){const img=await deskImg(url);const raw=await explainShot(url,q,history,onText);
  const nT=TMRAW().filter(t=>!t.del).length;const cal=agHandle(raw,q,img)||[];const zap=LAST_ZAPIS.slice();const hadTimer=TMRAW().filter(t=>!t.del).length>nT;
  const acts=[...zap.map(z=>({k:'note',nbId:z.nb.id,pi:z.pi,t:L('Zapsáno do sešitu','Written to')+' „'+z.nb.title+'“'})),...cal.map(a=>({k:'cal',t:L('Zapsáno do kalendáře','Added to calendar')+': '+a.title+' · '+agDate(a)})),...(hadTimer?[{k:'timer',t:L('Minutka běží','Timer running')}]:[])];
  return {text:cleanAns(raw,false),acts}}
function screenToNote(url,text){const title=L('Z obrazovky','From screen');let nb=S.notebooks.find(n=>n.title===title&&!n.deleted);
  if(!nb){nb=newNbNamed(title);nb.cover={color:'#6b7c93',pattern:'linen'}}
  if($('#modalRoot').children.length)closeModal();if(!S.profile.onboarded){S.profile.onboarded=true;save()}
  const fin=pi=>{if(text&&text.trim())pi=appendNote(nb,mdToNote(text,''));nb.edited=true;touch(nb);save();openNotebook(nb.id,pi);toast(L('Uloženo do sešitu „Z obrazovky“','Saved to the “From screen” notebook'))};
  if(!url){fin(nb.pages.length-1);return}
  deskImg(url).then(img=>fin(img?addImageToNb(nb,img):nb.pages.length-1))}
if(window.loopnoteDesktop){document.documentElement.classList.add('is-desktop');
  const D=window.loopnoteDesktop;const hello=()=>D.hello&&D.hello({ui:LANG(),loc:LOC(),autoRead:!!S.prefs.autoRead,cloud:VX_ON(),mode:S.prefs.deskTalk||'screen',subs:S.prefs.deskSubs!==false});window.__deskHello=hello;
  D.onSetPref&&D.onSetPref(p=>{if(p&&p.deskTalk){S.prefs.deskTalk=p.deskTalk;save();hello();toast(p.deskTalk==='screen'?L('Mluvení: jen hlas a kreslení na obrazovku','Talking: voice + drawing on screen'):L('Mluvení: s okénkem','Talking: with a panel'))}});hello();setInterval(hello,4000);
  vxEvt=e=>D.talkEvent&&D.talkEvent(Object.assign({sid:0},e));
  D.onImage(p=>screenToNote(p&&p.url!==undefined?p.url:p,(p&&p.text)||''));
  // přečtení nahlas řídí okénko (když ho mezitím zavřeš, nic nemluví)
  D.onExplain(async req=>{try{let last=0;const r=await deskAnswer(req.url,req.q,req.history,D.explainPartial?t=>{const n=Date.now();if(n-last>90){last=n;D.explainPartial({id:req.id,text:t})}}:undefined);D.explainResult({id:req.id,text:r.text,acts:r.acts,lang:LOC(),ui:LANG(),autoRead:!req.q&&!!S.prefs.autoRead})}
    catch(e){D.explainResult({id:req.id,err:errCopy(e&&e.code),lang:LOC(),ui:LANG()})}});
  D.onTalk&&D.onTalk(req=>{talkStop();if(!req.on)return;
    if(req.mode==='screen'){const hist=[],sid=req.sid;D.drawClear(false);
      talkLoop(async(q,part)=>{let lp=0,drawn=false;
          const raw=await screenAnswer(q,hist,rw=>{
            // kresba hned, jak AI dopíše kreslicí řádek (je na začátku odpovědi) – kreslí se, zatímco mluví
            if(!drawn){const it=drawItems(rw);if(it.length){drawn=true;D.draw({items:it})}}
            const t=cleanAns(rw,true);part&&part(t);const n=Date.now();if(n-lp>120){lp=n;D.talkEvent({sid,type:'partial',text:t})}});
          if(!drawn){const it=drawItems(raw);if(it.length)D.draw({items:it})}
          if(!/\[\[\s*KRESLI/i.test(raw))console.info('[Loopnote] AI tentokrát nic nekreslila');
          agHandle(raw,q,null);const text=cleanAns(raw,false);
          hist.push({role:'user',content:q},{role:'assistant',content:text});D.talkEvent({sid,type:'answer',q,text});return text},
        (st,x)=>{if(st==='level')return;if(st==='listening')D.drawClear(true);D.talkEvent({sid,type:'state',st,x:st==='speaking'?'':x})});return}const hist=(req.history||[]).slice();const sid=req.sid;
    talkLoop(async(q,part)=>{let lp=0;const r=await deskAnswer(req.url,q,hist,t=>{part&&part(t);const n=Date.now();if(n-lp>90){lp=n;D.talkEvent({sid,type:'partial',text:t})}});hist.push({role:'user',content:q},{role:'assistant',content:r.text});D.talkEvent({sid,type:'answer',q,text:r.text,acts:r.acts});return r.text},
      (st,x)=>{if(st!=='level')D.talkEvent({sid,type:'state',st,x:st==='speaking'?'':x});else D.talkEvent({sid,type:'level',x})})});
  D.onSpeak&&D.onSpeak(r=>{if(r&&r.text){unlockAudio();speak(r.text)}else stopSpeak()});
  D.onOpenNb&&D.onOpenNb(r=>{const nb=S.notebooks.find(n=>n.id===r.nbId);if(!nb)return;if($('#modalRoot').children.length)closeModal();if(!S.profile.onboarded){S.profile.onboarded=true;save()}openNotebook(nb.id,r.pi||0)});
  D.onCaptureFailed(()=>toast(L('Nejde vyfotit obrazovku. Na Macu povol Loopnote v Nastavení → Soukromí → Nahrávání obrazovky.','Could not capture the screen. On a Mac allow Loopnote in Settings → Privacy → Screen Recording.'),6000))}
function errCopy(code){const m=errCopy0(code),d=AI_DETAIL;AI_DETAIL='';return d&&!['cancelled','usage','refused','offline','busy'].includes(code)?m+' ('+String(d).slice(0,160)+')':m}

  notes:{en:'Notes',cs:'Poznámky',sk:'Poznámky',pl:'Notatki',de:'Notizen',fr:'Notes',es:'Apuntes',it:'Appunti',pt:'Apontamentos',uk:'Нотатки',hu:'Jegyzetek',nl:'Aantekeningen'},
  ideas:{en:'Ideas',cs:'Nápady',sk:'Nápady',pl:'Pomysły',de:'Ideen',fr:'Idées',es:'Ideas',it:'Idee',pt:'Ideias',uk:'Ідеї',hu:'Ötletek',nl:'Ideeën'}}}
function seedNotebooks(){const lg=(S&&S.prefs&&S.prefs.lang)||'en',SD=SEED3_(),T=k=>SD[k][lg]||SD[k].en;const d=seedNotebooksDemo();const m=d[0];
  const empty=(k,color,pattern,type)=>({id:uid(),title:T(k),subject:'',cover:{color,pattern},paper:{type,color:'white'},layout:'pages',pages:[{id:uid(),h:H,objs:[],rev:0,ocr:'',ocrRev:0}],updated:Date.now()-864e5,seed:true});
  return [Object.assign({},m,{title:T('math'),subject:'',pages:[m.pages[0]],seed:true}),empty('notes','#c0563f','linen','lines'),empty('ideas','#3d4a46','grid','blank')]}
function seedReview(){return {cards:[],exams:[],stats:{},streak:{d:'',n:0}}}
(function seedV3(){if(S.prefs.seed3)return;S.prefs.seed3=1;const old=S.notebooks.filter(n=>n.seed&&!n.edited&&!n.shared),ids=new Set(old.map(n=>n.id));

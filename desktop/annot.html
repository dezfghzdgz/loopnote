<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopnote – drawing on screen</title>
<style>
  /* průhledná vrstva přes celou obrazovku, myš jí prochází – pomocník tu kreslí, co ukazuje */
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;pointer-events:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #bud{display:none}
  #sub{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);max-width:min(760px,80vw);background:rgba(18,24,22,.86);color:#fff;
    font:500 17px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;padding:10px 16px;border-radius:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);
    display:flex;gap:10px;align-items:flex-start;opacity:0;transition:opacity .25s}
  #sub.on{opacity:1}
  #sub .dot{width:10px;height:10px;border-radius:50%;background:#e03131;flex:none;margin-top:7px}
  #sub.thinking .dot,#sub.heard .dot{background:#9b7bff;animation:p 1s infinite alternate}
  #sub.speaking .dot{background:#4f8dff}
  #sub.listening .dot{animation:p .8s infinite alternate}
  @keyframes p{from{opacity:.3}to{opacity:1}}
  #sub .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="bud"></canvas>
<div id="sub"><span class="dot"></span><span class="tx" id="tx"></span></div>
<script>
  const api = window.loopnoteDesktop, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const COL = { red: "#e03131", green: "#2f9e44", blue: "#1c7ed6", yellow: "#f59f00" };
  let items = [], start = 0, raf = 0, fade = 1, fadeT = 0, subsOn = true;
  const T = { listening: { en: "Listening…", cs: "Poslouchám…" }, thinking: { en: "Thinking…", cs: "Přemýšlím…" } };
  let ui = new URLSearchParams(location.search).get("ui") || "en";
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; draw(); }
  addEventListener("resize", size);
  // ručně vypadající čára: pár bodů s drobnými odchylkami
  function wob(seed) { let h = seed * 9301 + 49297; return () => { h = (h * 9301 + 49297) % 233280; return h / 233280 - .5; }; }
  function path(it) {
    const W = innerWidth, H = innerHeight, b = it.box || [0, 0, 0, 0];
    let y0 = b[0] / 1000 * H, x0 = b[1] / 1000 * W, y1 = b[2] / 1000 * H, x1 = b[3] / 1000 * W;
    if (x1 < x0) [x0, x1] = [x1, x0]; if (y1 < y0) [y0, y1] = [y1, y0];
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max(16, x1 - x0), h = Math.max(16, y1 - y0), r = wob(Math.round(cx + cy));
    const pts = [];
    if (it.type === "circle") { // kroužek kolem (trochu přetažený, jak to dělá člověk)
      const rx = w / 2 + 14, ry = h / 2 + 12;
      const ph = r() * 6; for (let a = 0; a <= Math.PI * 2.15; a += .05) { const k = 1 + .035 * Math.sin(a * 2 + ph) + a * .012; pts.push([cx + Math.cos(a - .6) * rx * k, cy + Math.sin(a - .6) * ry * k]); }
    } else if (it.type === "underline") {
      for (let i = 0; i <= 20; i++) pts.push([x0 - 4 + (w + 8) * i / 20, y1 + 6 + Math.sin(i / 3 + r()) * 1.6]);
    } else if (it.type === "box") {
      const p = 8; [[x0 - p, y0 - p], [x1 + p, y0 - p], [x1 + p, y1 + p], [x0 - p, y1 + p], [x0 - p, y0 - p]].forEach((q, i, a) => { if (!i) return pts.push(q); const s = a[i - 1]; for (let k = 1; k <= 10; k++) pts.push([s[0] + (q[0] - s[0]) * k / 10 + Math.sin(k) * .8, s[1] + (q[1] - s[1]) * k / 10 + Math.cos(k) * .8]); });
    } else if (it.type === "check") {
      const s = Math.min(46, Math.max(24, h)), bx = x1 + 12, by = cy;
      pts.push([bx, by], [bx + s * .35, by + s * .4], [bx + s, by - s * .55]);
    } else if (it.type === "cross") {
      const s = Math.min(40, Math.max(22, h)) / 2;
      return [[[cx - s, cy - s], [cx + s, cy + s]], [[cx + s, cy - s], [cx - s, cy + s]]];
    } else if (it.type === "arrow") { // šipka z volného místa k cíli
      const fromLeft = cx > W * .5, sx = fromLeft ? x0 - 150 : x1 + 150, sy = cy + (cy > H * .5 ? -90 : 90);
      const ex = fromLeft ? x0 - 10 : x1 + 10, ey = cy;
      for (let i = 0; i <= 16; i++) { const t = i / 16; pts.push([sx + (ex - sx) * t, sy + (ey - sy) * t + Math.sin(t * Math.PI) * -18]); }
      const a = Math.atan2(ey - pts[14][1], ex - pts[14][0]), hl = 18;
      return [pts, [[ex - hl * Math.cos(a - .5), ey - hl * Math.sin(a - .5)], [ex, ey], [ex - hl * Math.cos(a + .5), ey - hl * Math.sin(a + .5)]]];
    }
    return [pts];
  }
  function lineLen(p) { let l = 0; for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return l; }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.globalAlpha = fade;
    const now = performance.now(); let busy = false;
    items.forEach((it, idx) => {
      const t0 = start + idx * 650, prog = Math.max(0, Math.min(1, (now - t0) / 550)); if (prog < 1) busy = true; if (prog <= 0) return;
      const col = COL[it.color] || COL.red;
      if (it.type === "text") { // poznámka rukou vedle místa
        const W = innerWidth, H = innerHeight, b = it.box || [0, 0, 0, 0];
        const x = Math.min(W - 260, b[3] / 1000 * W + 14), y = Math.max(30, b[0] / 1000 * H + 4), s = String(it.text || "").slice(0, Math.ceil(String(it.text || "").length * prog));
        ctx.font = '600 24px "Segoe Print","Ink Free","Comic Sans MS","Bradley Hand",cursive'; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineJoin = "round";
        ctx.strokeText(s, x, y + 20); ctx.fillStyle = col; ctx.fillText(s, x, y + 20); return;
      }
      for (const seg of path(it)) {
        const L = lineLen(seg), want = L * prog; let acc = 0;
        for (const pass of [[9, "rgba(255,255,255,.85)"], [4.5, col]]) {
          ctx.lineWidth = pass[0]; ctx.strokeStyle = pass[1]; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); acc = 0;
          ctx.moveTo(seg[0][0], seg[0][1]);
          for (let i = 1; i < seg.length; i++) { const d = Math.hypot(seg[i][0] - seg[i - 1][0], seg[i][1] - seg[i - 1][1]); if (acc + d > want) { const k = (want - acc) / d; ctx.lineTo(seg[i - 1][0] + (seg[i][0] - seg[i - 1][0]) * k, seg[i - 1][1] + (seg[i][1] - seg[i - 1][1]) * k); break; } acc += d; ctx.lineTo(seg[i][0], seg[i][1]); }
          ctx.stroke();
        }
      }
    });
    if (busy) raf = requestAnimationFrame(draw); else raf = 0;
  }
  function show(list) {
    list = (list || []).slice(0, 8);
    // „point“ = kamarád tam doletí; když je kamarád vypnutý, nakreslí se místo toho šipka s popiskem
    const pts = list.filter((x) => x.type === "point");
    if (pts.length && BUD.on) { BUD.queue = pts.map(boxCenter); BUD.fly = null; }
    list = list.flatMap((x) => x.type !== "point" ? [x] : BUD.on ? [] : [{ type: "arrow", box: x.box, color: x.color || "blue" }].concat(x.text ? [{ type: "text", box: x.box, text: x.text, color: x.color || "blue" }] : []));
    items = list.slice(0, 6); start = performance.now(); fade = 1; clearInterval(fadeT); cancelAnimationFrame(raf); size(); raf = requestAnimationFrame(draw); }
  function clear(slow) {
    clearInterval(fadeT);
    if (!slow) { items = []; draw(); return; }
    fadeT = setInterval(() => { fade -= .06; if (fade <= 0) { clearInterval(fadeT); items = []; fade = 1; } draw(); }, 40);
  }
  const sub = document.getElementById("sub"), tx = document.getElementById("tx");
  function subtitle(st, text) {
    if (!subsOn || st === "off") { sub.classList.remove("on"); return; }
    sub.className = "on " + st;
    tx.textContent = text || (T[st] ? (T[st][ui] || T[st].en) : "");
  }
  /* ===== kamarád u kurzoru ===== */
  const bc = document.getElementById("bud"), bx = bc.getContext("2d");
  const BUD = { on: false, x: -100, y: -100, cx: -100, cy: -100, st: "", queue: [], fly: null, hold: 0, say: "", sayT: 0, jobs: 0, raf: 0, last: 0, blink: 0, seen: false };
  function boxCenter(it) { const b = it.box || [0, 0, 0, 0]; return { x: (b[1] + b[3]) / 2000 * innerWidth, y: (b[0] + b[2]) / 2000 * innerHeight, text: String(it.text || "").slice(0, 30) }; }
  function bsize() { bc.width = innerWidth * devicePixelRatio; bc.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", bsize); bsize();
  function budLoop(now) {
    const dt = Math.min(0.05, (now - (BUD.last || now)) / 1000); BUD.last = now;
    let tx = BUD.cx + 22, ty = BUD.cy + 24, pointing = null;
    // let po bodech: oblouk k cíli, chvíli tam zůstane s popiskem, pak další nebo zpět k myši
    if (!BUD.fly && BUD.queue.length) { const p = BUD.queue.shift(); BUD.fly = { p, fx: BUD.x, fy: BUD.y, t0: now, dur: 620 + Math.min(500, Math.hypot(p.x - BUD.x, p.y - BUD.y) * 0.35), hold: 2600 }; }
    if (BUD.fly) {
      const f = BUD.fly, k = Math.min(1, (now - f.t0) / f.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const ex = f.p.x + 16, ey = f.p.y + 18, mx = (f.fx + ex) / 2, my = Math.min(f.fy, ey) - 80 - Math.hypot(ex - f.fx, ey - f.fy) * 0.15;
      BUD.x = (1 - e) * (1 - e) * f.fx + 2 * (1 - e) * e * mx + e * e * ex; BUD.y = (1 - e) * (1 - e) * f.fy + 2 * (1 - e) * e * my + e * e * ey;
      if (k >= 1) { pointing = f.p; if (!f.at) f.at = now; if (now - f.at > f.hold) BUD.fly = null; }
    } else { const a = 1 - Math.exp(-dt * 16); BUD.x += (tx - BUD.x) * a; BUD.y += (ty - BUD.y) * a; }
    budDraw(now, pointing);
    BUD.raf = requestAnimationFrame(budLoop);
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function bubbleText(c, x, y, text, dark) {
    c.font = '600 14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif';
    const w = Math.min(420, c.measureText(text).width + 20), h = 28; let bx0 = x + 22, by0 = y - 14;
    if (bx0 + w > innerWidth - 8) bx0 = x - 22 - w; if (by0 < 8) by0 = 8;
    c.shadowColor = "rgba(0,0,0,.25)"; c.shadowBlur = 10; c.fillStyle = dark ? "rgba(18,24,22,.92)" : "#1f8f6e"; rr(c, bx0, by0, w, h, 10); c.fill(); c.shadowBlur = 0;
    c.fillStyle = "#fff"; c.fillText(text, bx0 + 10, by0 + 19, w - 20);
  }
  function budDraw(now, pointing) {
    const c = bx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, bc.width, bc.height); c.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    if (!BUD.seen) return;
    const st = BUD.st, x = BUD.x, y = BUD.y + (BUD.fly ? 0 : Math.sin(now / 520) * 1.6), R = 13;
    // ukazovátko: puls v místě a špička od kamaráda k cíli
    if (pointing) {
      const ph = ((now - BUD.fly.at) % 1200) / 1200;
      c.strokeStyle = `rgba(31,143,110,${.55 * (1 - ph)})`; c.lineWidth = 3; c.beginPath(); c.arc(pointing.x, pointing.y, 6 + ph * 22, 0, 7); c.stroke();
      c.fillStyle = "#1f8f6e"; c.beginPath(); c.moveTo(pointing.x, pointing.y); c.lineTo(x - R * .2, y - R * .95); c.lineTo(x - R * .95, y - R * .2); c.closePath(); c.fill();
      if (pointing.text) bubbleText(c, x, y, pointing.text, false);
    }
    // stín + tělo (kroužek Loopnote se žlutou tečkou)
    c.fillStyle = "rgba(0,0,0,.16)"; c.beginPath(); c.ellipse(x, y + R + 5, R * .8, 3, 0, 0, 7); c.fill();
    const ring = st === "listening" ? "#e03131" : st === "speaking" ? "#1c7ed6" : "#1f8f6e";
    if (st === "listening") { const p = (Math.sin(now / 180) + 1) / 2; c.fillStyle = `rgba(224,49,49,${.12 + .15 * p})`; c.beginPath(); c.arc(x, y, R + 6 + p * 4, 0, 7); c.fill(); }
    c.fillStyle = "#fff"; c.strokeStyle = ring; c.lineWidth = 4; c.beginPath(); c.arc(x, y, R, 0, 7); c.fill(); c.stroke();
    const da = st === "thinking" ? now / 260 : -0.75; // při přemýšlení tečka obíhá
    c.fillStyle = "#f5b800"; c.beginPath(); c.arc(x + Math.cos(da) * R, y + Math.sin(da) * R, 3.6, 0, 7); c.fill();
    // minutka: kolem kamaráda ubývá žlutý oblouk (kolik zbývá do pauzy / konce)
    if (BUD.timer && BUD.timer.end > Date.now()) {
      const left = BUD.timer.end - Date.now(), fr = Math.max(0, Math.min(1, left / (BUD.timer.total || 1)));
      c.strokeStyle = "rgba(245,184,0,.9)"; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.arc(x, y, R + 6, -Math.PI / 2, -Math.PI / 2 + fr * Math.PI * 2); c.stroke();
      const mm = Math.floor(left / 60000), ss = Math.floor(left / 1000) % 60;
      c.font = '700 10px "Segoe UI",system-ui,sans-serif'; c.fillStyle = "rgba(18,24,22,.85)"; const tt = mm + ":" + String(ss).padStart(2, "0"), tw = c.measureText(tt).width + 8;
      rr(c, x - tw / 2, y + R + 9, tw, 14, 7); c.fill(); c.fillStyle = "#fff"; c.fillText(tt, x - tw / 2 + 4, y + R + 20);
    }
    // obličej: oči (mrkají), pusa (při mluvení se hýbe)
    const look = st === "thinking" ? -2 : 0, blink = (now % 4200) < 120 ? .15 : 1;
    c.fillStyle = "#1c2420";
    c.beginPath(); c.ellipse(x - 4.2, y - 2 + look, 1.7, 2.3 * blink, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(x + 4.2, y - 2 + look, 1.7, 2.3 * blink, 0, 0, 7); c.fill();
    if (st === "speaking") { const o = 1 + 2.4 * Math.abs(Math.sin(now / 95) * Math.sin(now / 37)); c.beginPath(); c.ellipse(x, y + 4.5, 3, o, 0, 0, 7); c.fill(); }
    else { c.strokeStyle = "#1c2420"; c.lineWidth = 1.6; c.beginPath(); c.arc(x, y + 2.2, 3.4, .25 * Math.PI, .75 * Math.PI); c.stroke(); }
    // poslouchá: zvukové čárky vedle
    if (st === "listening") { c.fillStyle = "#e03131"; for (let i = 0; i < 3; i++) { const h = 4 + 6 * Math.abs(Math.sin(now / 140 + i * 1.3)); rr(c, x + R + 7 + i * 5, y - h / 2, 3, h, 1.5); c.fill(); } }
    // úkoly na pozadí: malá točící se tečka s číslem
    if (BUD.jobs > 0) { const jx = x - R - 4, jy = y - R - 2; c.fillStyle = "#1c2420"; c.beginPath(); c.arc(jx, jy, 7.5, 0, 7); c.fill(); c.strokeStyle = "#f5b800"; c.lineWidth = 2; c.beginPath(); c.arc(jx, jy, 5, now / 150, now / 150 + 4); c.stroke(); }
    if (BUD.say && now < BUD.sayT && !pointing) bubbleText(c, x, y, BUD.say, true);
  }
  function budOn(on) {
    BUD.on = on; bc.style.display = on ? "block" : "none";
    if (on && !BUD.raf) { BUD.last = 0; BUD.raf = requestAnimationFrame(budLoop); }
    if (!on && BUD.raf) { cancelAnimationFrame(BUD.raf); BUD.raf = 0; BUD.queue = []; BUD.fly = null; }
  }
  api.onAnnot((m) => {
    if (m.ui) ui = m.ui;
    if (m.buddy != null) budOn(!!m.buddy);
    if (m.cur) { BUD.cx = m.cur[0]; BUD.cy = m.cur[1]; if (!BUD.seen) { BUD.seen = true; BUD.x = BUD.cx + 22; BUD.y = BUD.cy + 24; } }
    if (m.jobs != null) BUD.jobs = m.jobs;
    if (m.timer !== undefined) BUD.timer = m.timer;
    if (m.say) { BUD.say = m.say; BUD.sayT = performance.now() + 5000; }
    if (m.st) BUD.st = m.st === "off" ? "" : m.st;
    if (m.subs != null) subsOn = !!m.subs;
    if (m.items) show(m.items);
    if (m.clear) clear(m.clear === "slow");
    if (m.st) subtitle(m.st, m.text);
  });
  size();
</script>
</body>
</html>

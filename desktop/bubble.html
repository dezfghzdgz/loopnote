<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopnote bubble</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none}
  #b{position:absolute;inset:6px;border-radius:50%;background:#0f7c6b;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px -8px rgba(0,0,0,.55);transition:transform .12s,background .2s}
  #b:hover{transform:scale(1.06)}
  #b svg{width:34px;height:34px;color:#fff}
  #b.listening{background:#c0392b;animation:pl 1.1s infinite}
  #b.thinking,#b.heard{background:#6b46c1}
  #b.speaking{background:#2357c6}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}100%{box-shadow:0 0 0 14px rgba(192,57,43,0)}}
</style>
</head>
<body>
<div id="b">
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M27.5 10.2C23.6 7.4 16.8 7.6 12.4 11.3 7.3 15.6 7.3 24 11.9 28.6c4.9 4.9 13.3 4.6 17.4-1 3.4-4.6 2.6-11.2-1.8-14.7-2.6-2.1-6-2.8-9-2" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/><circle cx="31.5" cy="8.5" r="3.4" fill="#ffd43b"/></svg>
</div>
<script>
  // klik = kroužkovat · podržet nebo pravý klik = mluvit · táhnout = posunout · 3× klik = schovat
  const TIP = {
    en: "Click: circle something · Hold or right-click: talk · Drag: move · Triple-click: hide",
    cs: "Klik: zakroužkovat · Podržet nebo pravý klik: mluvit · Táhnout: posunout · 3× klik: schovat",
  };
  const api = window.loopnoteDesktop, b = document.getElementById("b");
  b.title = TIP[(new URLSearchParams(location.search).get("ui") || "en")] || TIP.en;
  let st = null, taps = [], t = 0, hold = 0;
  b.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    b.setPointerCapture(e.pointerId); st = { x: e.screenX, y: e.screenY, moved: false, held: false };
    clearTimeout(hold); hold = setTimeout(() => { if (st && !st.moved) { st.held = true; taps = []; clearTimeout(t); api.bubbleTalk(); } }, 550);
  });
  b.addEventListener("pointermove", (e) => {
    if (!st) return;
    const dx = e.screenX - st.x, dy = e.screenY - st.y;
    if (!st.moved && Math.hypot(dx, dy) < 4) return;
    st.moved = true; clearTimeout(hold); st.x = e.screenX; st.y = e.screenY; api.bubbleMove(dx, dy);
  });
  b.addEventListener("pointerup", () => {
    clearTimeout(hold);
    if (!st) return; const { moved, held } = st; st = null; if (moved || held) return;
    const now = Date.now(); taps = taps.filter((x) => now - x < 900); taps.push(now); clearTimeout(t);
    if (taps.length >= 3) { taps = []; api.bubbleOff(); return; }
    t = setTimeout(() => { taps = []; api.bubbleClick(); }, 330);
  });
  b.addEventListener("contextmenu", (e) => { e.preventDefault(); api.bubbleTalk(); });
  api.onBubbleState && api.onBubbleState((s) => { b.className = s || ""; });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopnote – circle on screen</title>
<style>
  /* skoro průhledné: obrazovka pod tím žije dál (video hraje), jen kreslíš kroužek */
  html,body{margin:0;height:100%;overflow:hidden;background:rgba(0,0,0,.012);cursor:crosshair;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hint{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(15,124,107,.95);color:#fff;font:600 15px system-ui,sans-serif;padding:10px 16px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
  const T = {
    en: "Circle what you need help with · Esc = cancel", cs: "Zakroužkuj, s čím chceš pomoct · Esc = zrušit",
    sk: "Zakrúžkuj, s čím chceš pomôcť · Esc = zrušiť", pl: "Zakreśl, z czym potrzebujesz pomocy · Esc = anuluj",
    de: "Kreise ein, wobei du Hilfe brauchst · Esc = abbrechen", fr: "Entoure ce qui te pose problème · Échap = annuler",
    es: "Rodea lo que necesitas entender · Esc = cancelar", it: "Cerchia ciò che non ti è chiaro · Esc = annulla",
    pt: "Circula o que precisas de perceber · Esc = cancelar", uk: "Обведи те, з чим потрібна допомога · Esc = скасувати",
    hu: "Karikázd be, amiben segítség kell · Esc = mégse", nl: "Omcirkel waar je hulp bij nodig hebt · Esc = annuleren",
  };
  const ui = new URLSearchParams(location.search).get("ui") || "en";
  document.getElementById("hint").textContent = T[ui] || T.en;
  const api = window.loopnoteDesktop, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let pts = [], drawing = false;
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; paint(); }
  function paint() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    if (pts.length > 1) {
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.stroke();
      ctx.strokeStyle = "#e03131"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.stroke();
    }
  }
  size();
  addEventListener("resize", size);
  addEventListener("keydown", (e) => { if (e.key === "Escape") api.overlayDone(null); });
  addEventListener("contextmenu", (e) => { e.preventDefault(); api.overlayDone(null); });
  cv.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; cv.setPointerCapture(e.pointerId); drawing = true; pts = [[e.clientX, e.clientY]]; paint(); });
  cv.addEventListener("pointermove", (e) => { if (!drawing) return; pts.push([e.clientX, e.clientY]); paint(); });
  cv.addEventListener("pointerup", () => {
    if (!drawing) return; drawing = false;
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    let x = Math.min(...xs), y = Math.min(...ys), w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    if (w < 24 || h < 24) { pts = []; paint(); return; }
    const pad = 14; x = Math.max(0, x - pad); y = Math.max(0, y - pad);
    w = Math.min(innerWidth - x, w + 2 * pad); h = Math.min(innerHeight - y, h + 2 * pad);
    pts = []; paint();
    api.overlayDone({ x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
  });
  window.__test = (r) => api.overlayDone(r);
</script>
</body>
</html>

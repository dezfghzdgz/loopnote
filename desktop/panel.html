<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopnote</title>
<style>
  :root{--bg:#fbfaf7;--ink:#17201d;--mute:#6b7571;--line:rgba(23,32,29,.09);--acc:#0f7c6b;--acc2:#e3f2ee;--card:#ffffff;--red:#d64535;--q:#0f7c6b;--qink:#fff;--shadow:0 24px 60px -18px rgba(10,30,25,.45),0 2px 6px rgba(10,30,25,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#171b1a;--ink:#edf2f0;--mute:#9aa7a2;--line:rgba(255,255,255,.08);--acc:#3fbfa8;--acc2:#1f2f2b;--card:#20262449;--q:#2a6f63;--qink:#eafffa;--shadow:0 24px 60px -18px rgba(0,0,0,.8)}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;color:var(--ink);font:14.5px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #card{position:absolute;inset:10px;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  header{-webkit-app-region:drag;display:flex;align-items:center;gap:9px;padding:12px 10px 10px 16px;user-select:none}
  header svg.logo{width:22px;height:22px;flex:none}
  header b{font-weight:700;font-size:14px;letter-spacing:.1px}
  header .sp{flex:1}
  header button{-webkit-app-region:no-drag}
  .ib{border:0;background:none;color:var(--mute);width:30px;height:30px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .ib svg{width:17px;height:17px}
  .ib:hover{background:var(--acc2);color:var(--ink)}
  main{flex:1;overflow:auto;padding:2px 16px 8px;scroll-behavior:smooth}
  main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .shot{position:relative;margin:0 0 14px;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .shot img{display:block;width:100%;max-height:130px;object-fit:contain;background:#fff}
  .shot span{position:absolute;left:8px;top:8px;background:rgba(15,124,107,.92);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .shot[hidden]{display:none}
  .msg{margin:0 0 12px;animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
  .msg ul{margin:0 0 8px;padding-left:20px}.msg li{margin:2px 0}
  .msg b{color:var(--acc)}
  .msg.live::after{content:"";display:inline-block;width:7px;height:15px;margin-left:2px;background:var(--acc);vertical-align:-2px;border-radius:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .q{background:var(--q);color:var(--qink);border-radius:16px 16px 4px 16px;padding:7px 12px;margin:2px 0 12px auto;width:fit-content;max-width:85%;animation:fade .15s}
  .think{color:var(--mute);display:flex;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}
  .think i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:p 1s infinite alternate}
  .think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
  @keyframes p{from{opacity:.25;transform:translateY(0)}to{opacity:1;transform:translateY(-2px)}}
  .err{color:var(--red)}
  .hello{color:var(--mute);margin:4px 0 14px}
  .act{display:flex;align-items:center;gap:8px;background:var(--acc2);border-radius:12px;padding:7px 8px 7px 12px;margin:-4px 0 12px;font-size:13px}
  .act span{flex:1}
  .act button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:4px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
  .chips[hidden]{display:none}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;transition:background .12s,border-color .12s}
  .chip:hover{border-color:var(--acc);background:var(--acc2)}
  footer{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .talk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);padding:0 4px}
  .talk[hidden]{display:none}
  .talk .lv{width:10px;height:10px;border-radius:50%;background:var(--red);transform:scale(calc(1 + var(--lv,0)));transition:transform .08s}
  .talk.thinking .lv,.talk.heard .lv{background:#7c5cd6;animation:p 1s infinite alternate}
  .talk.speaking .lv{background:#2f6fe0}
  form{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  form:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
  input{flex:1;min-width:0;border:0;background:none;color:var(--ink);padding:7px 6px;font:inherit;outline:none}
  .rb{border:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:none;color:var(--mute);flex:none}
  .rb svg{width:18px;height:18px}
  .rb:hover{background:var(--acc2);color:var(--ink)}
  #send{background:var(--acc);color:#fff}#send:hover{filter:brightness(1.08)}#send:disabled{opacity:.45;cursor:default}
  #mic.on{background:var(--red);color:#fff;animation:ring 1.2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(214,69,53,.45)}100%{box-shadow:0 0 0 10px rgba(214,69,53,0)}}
  .row{display:flex;gap:6px;align-items:center}
  .btn{border:0;background:none;color:var(--mute);border-radius:9px;padding:6px 9px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn svg{width:15px;height:15px}
  .btn:hover{background:var(--acc2);color:var(--ink)}
  .btn.pri{margin-left:auto;background:var(--acc);color:#fff;padding:7px 12px}
  .btn.pri:hover{filter:brightness(1.07)}
  .btn[hidden]{display:none}
</style>
</head>
<body>
<div id="card">
<header>
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M27.5 10.2C23.6 7.4 16.8 7.6 12.4 11.3 7.3 15.6 7.3 24 11.9 28.6c4.9 4.9 13.3 4.6 17.4-1 3.4-4.6 2.6-11.2-1.8-14.7-2.6-2.1-6-2.8-9-2" fill="none" stroke="#0f7c6b" stroke-width="4" stroke-linecap="round"/><circle cx="31.5" cy="8.5" r="3.6" fill="#ffd43b"/></svg>
  <b>Loopnote</b><span class="sp"></span>
  <button class="ib" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  <button class="ib" id="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>
<main id="m"><div class="shot" id="shot" hidden><img id="th" alt=""><span id="shotL"></span></div></main>
<footer>
  <div class="talk" id="talk" hidden><span class="lv"></span><span id="talkT"></span></div>
  <form id="f">
    <button type="button" class="rb" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <input id="in" autocomplete="off">
    <button class="rb" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="row">
    <button class="btn" id="say"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg><span id="sayT"></span></button>
    <button class="btn pri" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/></svg><span id="saveT"></span></button>
  </div>
</footer>
</div>
<script>
  // 0 přemýšlím, 1 placeholder, 2 přečíst, 3 zastavit, 4 uložit, 5 zavřít, 6 znovu, 7 chyba, 8 bez odpovědi,
  // 9 poslouchám, 10 mluvím, 11 mluvit, 12 otevřít, 13 úvod bez obrázku, 14–17 rychlé akce, 18 zakroužkováno
  const S = {
    en:["Thinking…","Ask or say anything…","🔊 Read aloud","■ Stop","Save to notebook","Close","Circle again","Something went wrong. Try again.","The AI didn’t answer in time. Try again – if it keeps failing, in the app: Settings → AI connection → Test.","Listening… go ahead","Speaking… click the mic to interrupt","Talk","Open","Hi! Ask me anything – I can explain, write into your notebooks, add things to your calendar or set a timer.","Simpler","Show all steps","Give an example","Quiz me","Circled"],
    cs:["Přemýšlím…","Zeptej se nebo řekni cokoli…","🔊 Přečíst","■ Zastavit","Uložit do sešitu","Zavřít","Zakroužkovat znovu","Něco se pokazilo. Zkus to znovu.","AI neodpověděla včas. Zkus to znovu – a když to nepůjde, v appce: Nastavení → Spojení s AI → Otestovat.","Poslouchám… mluv","Mluvím… klikni na mikrofon a skoč mi do řeči","Mluvit","Otevřít","Ahoj! Ptej se na cokoli – vysvětlím, zapíšu ti to do sešitu, do kalendáře nebo nastavím minutku.","Jednodušeji","Celý postup","Dej příklad","Vyzkoušej mě","Zakroužkováno"],
    sk:["Rozmýšľam…","Opýtaj sa alebo povedz čokoľvek…","🔊 Prečítať","■ Zastaviť","Uložiť do zošita","Zavrieť","Zakrúžkovať znova","Niečo sa pokazilo. Skús to znova.","Žiadna odpoveď – si pripojený na internet?","Počúvam… hovor","Hovorím… klikni na mikrofón a skoč mi do reči","Hovoriť","Otvoriť","Ahoj! Pýtaj sa na čokoľvek – vysvetlím, zapíšem do zošita, do kalendára alebo nastavím minútku.","Jednoduchšie","Celý postup","Daj príklad","Vyskúšaj ma","Zakrúžkované"],
    pl:["Myślę…","Zapytaj lub powiedz coś…","🔊 Przeczytaj","■ Zatrzymaj","Zapisz w zeszycie","Zamknij","Zakreśl ponownie","Coś poszło nie tak. Spróbuj ponownie.","Brak odpowiedzi – czy masz internet?","Słucham… mów","Mówię… kliknij mikrofon, aby przerwać","Mów","Otwórz","Cześć! Pytaj o wszystko – wyjaśnię, zapiszę w zeszycie, w kalendarzu albo ustawię minutnik.","Prościej","Cały tok","Daj przykład","Przepytaj mnie","Zakreślone"],
    de:["Ich denke nach…","Frag oder sag etwas…","🔊 Vorlesen","■ Stopp","Im Heft speichern","Schließen","Neu einkreisen","Etwas ist schiefgelaufen. Versuch es noch mal.","Keine Antwort – bist du online?","Ich höre zu… sprich","Ich spreche… klick aufs Mikro, um zu unterbrechen","Sprechen","Öffnen","Hi! Frag mich alles – ich erkläre, schreibe in dein Heft, trage Termine ein oder stelle einen Timer.","Einfacher","Alle Schritte","Ein Beispiel","Frag mich ab","Eingekreist"],
    fr:["Je réfléchis…","Demande ou dis quelque chose…","🔊 Lire à voix haute","■ Arrêter","Enregistrer dans le cahier","Fermer","Entourer à nouveau","Un problème est survenu. Réessaie.","Pas de réponse – es-tu connecté ?","Je t'écoute… parle","Je parle… clique sur le micro pour m'interrompre","Parler","Ouvrir","Salut ! Demande-moi tout – j'explique, j'écris dans tes cahiers, j'ajoute au calendrier ou je lance un minuteur.","Plus simple","Toutes les étapes","Un exemple","Interroge-moi","Entouré"],
    es:["Pensando…","Pregunta o di algo…","🔊 Leer en voz alta","■ Parar","Guardar en el cuaderno","Cerrar","Rodear de nuevo","Algo salió mal. Inténtalo de nuevo.","Sin respuesta: ¿tienes internet?","Te escucho… habla","Hablando… pulsa el micro para interrumpir","Hablar","Abrir","¡Hola! Pregúntame lo que quieras: explico, escribo en tus cuadernos, apunto en el calendario o pongo un temporizador.","Más fácil","Todos los pasos","Un ejemplo","Pregúntame","Rodeado"],
    it:["Sto pensando…","Chiedi o di' qualcosa…","🔊 Leggi ad alta voce","■ Ferma","Salva nel quaderno","Chiudi","Cerchia di nuovo","Qualcosa è andato storto. Riprova.","Nessuna risposta: sei connesso?","Ti ascolto… parla","Sto parlando… clicca il microfono per interrompere","Parla","Apri","Ciao! Chiedimi qualsiasi cosa: spiego, scrivo nei quaderni, aggiungo al calendario o imposto un timer.","Più semplice","Tutti i passaggi","Un esempio","Interrogami","Cerchiato"],
    pt:["A pensar…","Pergunta ou diz algo…","🔊 Ler em voz alta","■ Parar","Guardar no caderno","Fechar","Circular de novo","Algo correu mal. Tenta de novo.","Sem resposta – tens internet?","Estou a ouvir… fala","A falar… clica no micro para interromper","Falar","Abrir","Olá! Pergunta o que quiseres – explico, escrevo nos cadernos, ponho no calendário ou ativo um temporizador.","Mais simples","Todos os passos","Um exemplo","Testa-me","Circulado"],
    uk:["Думаю…","Запитай або скажи щось…","🔊 Прочитати","■ Зупинити","Зберегти в зошит","Закрити","Обвести знову","Щось пішло не так. Спробуй ще раз.","Немає відповіді – чи є інтернет?","Слухаю… говори","Говорю… натисни мікрофон, щоб перебити","Говорити","Відкрити","Привіт! Питай що завгодно – поясню, запишу в зошит, у календар або поставлю таймер.","Простіше","Усі кроки","Дай приклад","Перевір мене","Обведено"],
    hu:["Gondolkodom…","Kérdezz vagy mondj valamit…","🔊 Felolvasás","■ Leállítás","Mentés a füzetbe","Bezárás","Új karikázás","Valami hiba történt. Próbáld újra.","Nincs válasz – van internet?","Hallgatlak… beszélj","Beszélek… kattints a mikrofonra a félbeszakításhoz","Beszéd","Megnyitás","Szia! Kérdezz bármit – elmagyarázom, beírom a füzetbe, a naptárba, vagy beállítok egy időzítőt.","Egyszerűbben","Minden lépés","Mondj példát","Kérdezz ki","Bekarikázva"],
    nl:["Even denken…","Vraag of zeg iets…","🔊 Voorlezen","■ Stop","Opslaan in schrift","Sluiten","Opnieuw omcirkelen","Er ging iets mis. Probeer het opnieuw.","Geen antwoord – ben je online?","Ik luister… zeg het maar","Ik praat… klik op de microfoon om te onderbreken","Praten","Openen","Hoi! Vraag me alles – ik leg uit, schrijf in je schriften, zet het in je agenda of start een timer.","Simpeler","Alle stappen","Geef een voorbeeld","Overhoor me","Omcirkeld"],
  };
  // rychlé akce na jedno kliknutí (posílá se jako otázka v jazyce appky)
  const QA = {
    en: ["Explain it more simply, like to a beginner.", "Show me the full solution step by step.", "Give me a similar example and solve it.", "Ask me one short question to check I understood. Don't give the answer yet."],
    cs: ["Vysvětli to jednodušeji, jako začátečníkovi.", "Ukaž mi celý postup krok za krokem.", "Dej mi podobný příklad a vyřeš ho.", "Polož mi jednu krátkou otázku, jestli jsem to pochopil. Odpověď zatím neříkej."],
  };
  const qs = new URLSearchParams(location.search);
  let ui = qs.get("ui") || "en", t = S[ui] || S.en;
  const api = window.loopnoteDesktop, $ = (id) => document.getElementById(id), m = $("m");
  let url = "", hist = [], answers = [], waiting = null, live = null, speaking = false, talkOn = false, talkSid = 0, talkState = "", chips = null;
  function labels() {
    $("in").placeholder = t[1]; $("sayT").textContent = speaking ? t[3].replace(/^\S+\s/, "") : t[2].replace(/^\S+\s/, ""); $("saveT").textContent = t[4];
    $("x").title = t[5]; $("again").title = t[6]; $("mic").title = t[11]; $("shotL").textContent = t[18] || "";
    const T = { listening: t[9], thinking: t[0], heard: t[0], speaking: t[10] };
    $("talkT").textContent = T[talkState] || "";
  }
  labels();
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function md(text) { // jednoduchý markdown: odstavce, odrážky, **tučně**
    const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    let out = "", list = false;
    for (const raw of String(text).split(/\n/)) {
      const l = raw.trim();
      const li = l.match(/^([-•*]|\d+[.)])\s+(.*)$/);
      if (li) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inl(li[2]) + "</li>"; continue; }
      if (list) { out += "</ul>"; list = false; }
      if (l) out += "<p>" + inl(l.replace(/^#+\s*/, "")) + "</p>";
    }
    return out + (list ? "</ul>" : "");
  }
  const scroll = () => { m.scrollTop = m.scrollHeight; };
  function dropChips() { if (chips) { chips.remove(); chips = null; } }
  function thinking() { if (waiting) return; dropChips(); const d = document.createElement("div"); d.className = "think"; d.innerHTML = "<i></i><i></i><i></i><span>" + esc(t[0]) + "</span>"; m.appendChild(d); waiting = d; scroll(); }
  function unthink() { if (waiting) { waiting.remove(); waiting = null; } }
  // průběžný text odpovědi
  function partial(text) { unthink(); if (!live) { live = document.createElement("div"); live.className = "msg live"; m.appendChild(live); } live.innerHTML = md(text); scroll(); }
  function endLive() { if (live) { live.remove(); live = null; } }
  function addQ(q) { dropChips(); const d = document.createElement("div"); d.className = "q"; d.textContent = q; m.appendChild(d); scroll(); }
  function addChips() {
    dropChips(); if (talkOn) return;
    chips = document.createElement("div"); chips.className = "chips";
    const qa = QA[ui] || QA.en;
    [14, 15, 16, 17].forEach((k, i) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t[k]; b.onclick = () => send(qa[i], t[k]); chips.appendChild(b); });
    m.appendChild(chips);
  }
  function addAnswer(text, acts) {
    endLive();
    if (text) { const d = document.createElement("div"); d.className = "msg"; d.innerHTML = md(text); m.appendChild(d); }
    for (const a of acts || []) {
      const c = document.createElement("div"); c.className = "act";
      c.innerHTML = "<span>" + (a.k === "note" ? "📝 " : a.k === "cal" ? "📅 " : "⏱ ") + esc(a.t) + "</span>" + (a.k === "note" ? '<button type="button">' + esc(t[12]) + "</button>" : "");
      if (a.k === "note") c.querySelector("button").onclick = () => api.openNb({ nbId: a.nbId, pi: a.pi });
      m.appendChild(c);
    }
    if (text) { answers.push(text); addChips(); }
    scroll();
  }
  function addErr(msg) { endLive(); const d = document.createElement("div"); d.className = "msg"; d.innerHTML = '<p class="err">' + esc(msg) + "</p>"; m.appendChild(d); scroll(); }
  function ask(q) { thinking(); $("send").disabled = true; api.ask({ url, q: q || "", history: hist.slice() }); }
  function send(q, shown) { if (waiting || live) return; if (talkOn) stopTalk(); addQ(shown || q); ask(q); hist.push({ role: "user", content: q }); }
  function setUi(r) { if (r && r.ui && S[r.ui] && r.ui !== ui) { ui = r.ui; t = S[ui]; labels(); } }

  api.onPanelInit((d) => {
    url = d.url || ""; setUi(d);
    if (url) { $("th").src = url; $("shot").hidden = false; ask(""); }
    else { $("save").hidden = true; $("again").hidden = true; const h = document.createElement("p"); h.className = "hello"; h.textContent = t[13]; m.appendChild(h); }
    if (d.talk) startTalk();
    setTimeout(() => $("in").focus(), 50);
  });
  api.onPartial && api.onPartial((r) => { if (r && r.text) partial(r.text); });
  api.onAnswer((r) => {
    setUi(r); unthink(); $("send").disabled = false;
    const acts = r.acts || [];
    if (r.err || (!r.text && !acts.length)) addErr(r.err === "timeout" ? t[8] : (r.err || t[7]));
    else { addAnswer(r.text || "", acts); hist.push({ role: "assistant", content: r.text || acts.map((a) => a.t).join("\n") }); if (r.autoRead && r.text && !talkOn) api.speak({ text: r.text }); }
    $("in").focus();
  });
  $("f").addEventListener("submit", (e) => { e.preventDefault(); const q = $("in").value.trim(); if (!q) return; $("in").value = ""; send(q); });
  $("send").addEventListener("click", (e) => { e.preventDefault(); $("f").requestSubmit(); });

  // rozhovor hlasem – poslech, přepis, odpověď i hlas řeší appka (přirozený hlas Gemini)
  function startTalk() { talkOn = true; talkSid = Date.now(); dropChips(); $("mic").classList.add("on"); api.talk({ on: true, sid: talkSid, url, history: hist.slice() }); }
  function stopTalk() { talkOn = false; $("mic").classList.remove("on"); talkState = ""; $("talk").hidden = true; unthink(); api.talk({ on: false }); }
  $("mic").addEventListener("click", () => {
    if (talkOn && talkState === "speaking") { api.speak(null); return; } // skočit do řeči: přestane mluvit a hned poslouchá
    if (talkOn) stopTalk(); else startTalk();
  });
  api.onTalkEvent((e) => {
    if (e.type === "speaking") { speaking = !!e.on; labels(); return; }
    if (e.sid !== talkSid) return;
    if (e.type === "level") { $("talk").style.setProperty("--lv", Math.min(1, (e.x || 0) * 14).toFixed(2)); return; }
    if (e.type === "partial") { if (e.text) partial(e.text); return; }
    if (e.type === "answer") { unthink(); addAnswer(e.text || "", e.acts); hist.push({ role: "user", content: e.q }, { role: "assistant", content: e.text || (e.acts || []).map((a) => a.t).join("\n") }); return; }
    if (e.type === "state") {
      talkState = e.st; const box = $("talk"); box.className = "talk " + e.st; box.hidden = !talkOn || e.st === "off" || e.st === "error"; labels();
      if (e.st === "heard") { addQ(e.x); thinking(); }
      if (e.st === "error") { unthink(); addErr(e.x || t[7]); }
      if (e.st === "off" || e.st === "error") { talkOn = false; $("mic").classList.remove("on"); talkState = ""; if (answers.length) addChips(); }
    }
  });
  $("say").addEventListener("click", () => {
    if (speaking) { api.speak(null); return; }
    const text = answers[answers.length - 1]; if (text) api.speak({ text });
  });
  const shut = () => { if (talkOn) stopTalk(); api.speak(null); };
  $("save").addEventListener("click", () => { shut(); api.save({ url, text: hist.map((h) => (h.role === "user" ? "**" + h.content + "**" : h.content)).join("\n\n") }); });
  $("x").addEventListener("click", () => { shut(); api.close(); });
  $("again").addEventListener("click", () => { shut(); api.again(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape") { shut(); api.close(); } });
</script>
</body>
</html>
